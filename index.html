    var o = G.endless.over, k = Math.min(1, o.t * 4), st = G.active, cx = st && st.legend ? 318 : VW / 2;
    g.globalAlpha = k; ribbon(cx, Math.round(84 - (1 - k) * 16), 'Oops!'); g.globalAlpha = 1;
    // the right thing or the right person: a bouncing arrow over it
    if (!st) return;
    var bob = Math.round(Math.abs(Math.sin(G.t * 5)) * -4), marks = [];
    if (st.type === 'fetch') st.items.forEach(function (it) { if (it.glow && !it.gone && !it.carried) marks.push([it.x, it.y - 30]); });
    if (st.type === 'deliver') st.npcs.forEach(function (p) { if (p.glow) marks.push([p.x, headTop(p) - 4]); });
    marks.forEach(function (m) { F.draw(g, '▼', Math.round(m[0] - G.cam.x), Math.round(m[1] - 18 + bob), { color: GOLD, outline: INK, align: 'center', scale: 2 }); });
  }

  /* ---- the class table: Batuhan Teacher at the board, the hero beside it */
  function drawBoard() {
    uiButtons = [];
    var E = G.endless, Bd = G.board, t = G.t;
    SC.classroomBackground(g, 80);
    U.rect(g, '#3a2418', 0, GY - 1, VW, 1); U.rect(g, '#d9a066', 0, GY, VW, 6); U.rect(g, '#f6c890', 0, GY, VW, 1); U.rect(g, '#7a4a2e', 0, GY + 6, VW, VH - GY - 6);
    g.fillStyle = 'rgba(16,10,34,0.25)'; g.fillRect(0, 0, VW, VH);
    var w = 252, h = 178, x = Math.round(VW / 2 - w / 2), y = 26, f = U.WOOD;
    chalkboardAt(x, y, w, h);
    U.rect(g, INK, x - 5, y + h, w + 10, 5); U.rect(g, f[1], x - 4, y + h + 1, w + 8, 3); U.rect(g, f[0], x - 4, y + h + 1, w + 8, 1);   // the chalk tray
    U.rect(g, '#ffffff', x + 20, y + h - 1, 9, 2); U.rect(g, '#ffd64a', x + 34, y + h - 1, 7, 2); U.rect(g, '#ff8fab', x + 46, y + h - 1, 7, 2);
    var hw = chalk('TOP 10', VW / 2, y + 10, { align: 'center' });
    U.star(g, Math.round(VW / 2 - hw / 2 - 16), y + 10); U.star(g, Math.round(VW / 2 + hw / 2 + 7), y + 10);
    for (var dx = x + 16; dx < x + w - 16; dx += 4) U.rect(g, 'rgba(248,245,234,0.45)', dx, y + 25, 2, 1);
    var ry = y + 32;
    if (E.table === 'wait') {   // the class table is on its way: three chalk dots, one after another
      for (var di = 0; di < 3; di++) if (Math.floor(t * 3) % 4 > di) U.rect(g, '#f8f5ea', VW / 2 - 16 + di * 13, y + 86, 5, 5);
    } else boardRows().forEach(function (r) {
      if (!r) { chalk('· · ·', VW / 2, ry - 3, { align: 'center', bold: false, color: '#cfe8d6' }); ry += 8; return; }
      var col = r.mine ? '#ffe27e' : '#f8f5ea';
      if (r.mine) {
        U.rect(g, 'rgba(255,226,126,0.18)', x + 10, ry - 2, w - 20, 13);
        F.draw(g, '▶', x + 14 + Math.round(Math.sin(t * 6)), ry, { color: '#ffe27e', bold: false });
      }
      var medal = r.rank === 1 ? '#ffd64a' : r.rank === 2 ? '#e6eef4' : r.rank === 3 ? '#f0a868' : col;
      chalk(r.rank + '.', x + 48, ry, { align: 'right', color: medal });
      chalk(r.name, x + 56, ry, { color: col });
      chalk(String(r.score), x + w - 22, ry, { align: 'right', color: col });
      ry += 13;
    });
    if (E.table === 'offline') F.draw(g, 'No internet: this device only', VW / 2, y + h + 9, { color: '#ffffff', outline: INK, bold: false, align: 'center' });
    // Batuhan Teacher points at the table; the hero cheers (a new best) or keeps their chin up
    var tc = CH.get('batuhan', 'point', blinking(0.3) ? 'blink' : 'happy', 1);
    WD.shadow(g, 70, GY + 1, 17); drawSprite(tc, 70, GY + 1, 1);
    var hid = G.heroId || 'me', hp = E.newBest ? (Math.floor(t * 3) % 2 ? 'cheer' : 'stand') : Math.floor(t * 1.6) % 2 ? 'breathe' : 'stand';
    var hs = CH.get(hid, hp, blinking(0.6) ? 'blink' : E.newBest || E.first ? 'happy' : 'neutral', 1);
    WD.shadow(g, 410, GY + 1, 17); drawSprite(hs, 410, GY + 1, -1);
    var pip = CH.get('pip', Math.floor(t * 8) % 2 ? 'flap' : 'rest', E.newBest ? 'happy' : 'neutral', 1);
    drawSprite(pip, 438, 186 + Math.round(Math.sin(t * 3) * 3), -1);
    ribbon(VW / 2, 5, E.newBest ? 'New best!  ' + E.score : 'Your score:  ' + E.score);
    // Play again / Menu
    [['Play again', 0], ['Menu', 1]].forEach(function (bt) {
      var i2 = bt[1], on = Bd.sel === i2, bw = 104, bh = 22, bx = Math.round(VW / 2 + (i2 ? 8 : -8 - bw)), byy = 238;
      U.rect(g, INK, bx, byy, bw, bh); U.rect(g, on ? '#f7a83a' : '#3a2f66', bx + 1, byy + 1, bw - 2, bh - 2); U.rect(g, on ? '#ffd98a' : '#5a4f86', bx + 1, byy + 1, bw - 2, 1);
      if (on) { U.rect(g, '#ffffff', bx - 2, byy - 2, bw + 4, 1); U.rect(g, '#ffffff', bx - 2, byy + bh + 1, bw + 4, 1); }
      F.draw(g, bt[0], bx + bw / 2, byy + 5, { color: on ? INK : '#ffffff', align: 'center' });
      button(bx, byy, bw, bh, function () { if (G.board && G.board.t > 0.6) { G.board.sel = i2; boardGo(i2); } });
    });
    if (!G.touch) { F.draw(g, '← →  choose', 6, 245, { color: '#ffffff', outline: INK, bold: false }); F.draw(g, 'E  OK', 6, 257, { color: '#ffffff', outline: INK, bold: false }); }
    fullscreenButton(457, 6);
  }

  function render() {
    g.imageSmoothingEnabled = false;
    if (G.mode === 'title') drawTitle();
    else if (G.mode === 'create') drawCreate();
    else if (G.mode === 'play') drawPlay();
    else if (G.mode === 'results') drawResults();
    else if (G.mode === 'report') drawReport();
    else if (G.mode === 'board') drawBoard();
    drawFade();
    present();
  }

  /* ---- a phone held upright: the game waits on a card of its own, Pip
   * says "Turn your phone!" and a phone turns sideways. On Android a tap
   * goes full screen and turns it for you. */
  var phoneIcon = null;
  function drawRotate(t) {
    var c = rg, cx = RW / 2;
    var sky = c.createLinearGradient(0, 0, 0, RH); sky.addColorStop(0, '#3a2b6e'); sky.addColorStop(1, '#0b0812');
    c.fillStyle = sky; c.fillRect(0, 0, RW, RH);
    for (var i = 0; i < 18; i++) {                         // a few twinkling stars
      var sx = (i * 97) % RW, sy = (i * 53) % 150 + 6;
      c.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + i); U.rect(c, '#fff1a6', sx, sy, 1, 1);
    }
    c.globalAlpha = 1;
    var l1 = logoCache('rot1', function () { return F.logo('POCKET', { scale: 3, depth: 4 }); });
    var l2 = logoCache('rot2', function () { return F.logo('QUEST', { scale: 3, depth: 4 }); });
    c.drawImage(l1, Math.round(cx - l1.width / 2), 20); c.drawImage(l2, Math.round(cx - l2.width / 2), 20 + l1.height - 2);
    if (!phoneIcon) {                                      // a little phone, drawn once
      phoneIcon = document.createElement('canvas'); phoneIcon.width = 30; phoneIcon.height = 50;
      var p = phoneIcon.getContext('2d');
      U.rect(p, INK, 1, 0, 28, 50); U.rect(p, INK, 0, 1, 30, 48);
      U.rect(p, U.COL.gold, 2, 2, 26, 46); U.rect(p, U.COL.goldHi, 3, 2, 24, 1);
      U.rect(p, '#5bb6f5', 4, 6, 22, 36); U.rect(p, '#a8e4ff', 4, 6, 22, 2); U.rect(p, '#7ee07a', 4, 34, 22, 8);
      U.rect(p, U.COL.goldDeep, 12, 44, 6, 2);
    }
    var k = (t % 2.8) / 2.8, turn = Math.min(1, Math.max(0, (k - 0.25) / 0.3));
    turn = turn * turn * (3 - 2 * turn);                   // ease in and out
    var a = -Math.PI / 2 * turn, py = 150;
    c.globalAlpha = k > 0.88 ? Math.max(0, 1 - (k - 0.88) / 0.12) : 1;
    c.save(); c.translate(cx, py); c.rotate(a); c.drawImage(phoneIcon, -15, -25); c.restore();
    c.globalAlpha = 1;
    for (var d = 0; d < 7; d++) {                          // the turning arrow, a dotted arc
      var an = -Math.PI * 0.95 + d * 0.13;
      if (d / 7 < turn + 0.15) U.rect(c, '#fff1a6', Math.round(cx + Math.cos(an) * 38), Math.round(py + Math.sin(an) * 38), 2, 2);
    }
    var pip = CH.get('pip', Math.floor(t * 6) % 2 ? 'flap' : 'rest', 'happy', 1);
    c.drawImage(pip, 22, 196 + Math.round(Math.sin(t * 3) * 2));
    U.panel(c, 10, 228, RW - 20, canTurn() ? 44 : 30);
    F.draw(c, 'Turn your phone!', cx, 238, { color: U.COL.gold, align: 'center' });
    if (canTurn() && Math.floor(t * 2) % 2 === 0) F.draw(c, 'or tap here', cx, 253, { color: '#ffffff', bold: false, align: 'center' });
  }

  /* ================================================================ loop */
  var last = 0, accum = 0, STEP = 1 / 60, paused = false;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (paused) return;
    if (ROTATE) { last = ts; accum = 0; drawRotate(ts / 1000); present(); return; }   // upright: the game waits
    var dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts; accum += dt;
    while (accum >= STEP) { update(STEP); accum -= STEP; }
    render();
  }
  requestAnimationFrame(loop);

  /* ================================================================ dev hook */
  PQ.G = G;
  PQ.debug = {
    pause: function (on) { paused = on; },
    step: function (n, keysDown) {
      for (var i = 0; i < (n || 1); i++) {
        if (keysDown) Object.keys(keysDown).forEach(function (k) { if (keysDown[k] && !keys[k]) pressed[k] = true; keys[k] = !!keysDown[k]; });
        update(STEP);
      }
      render();
    },
    press: function (k) { pressed[k] = true; },
    start: function (id) { startGame(id || 'rio'); },
    title: function () { G.mode = 'title'; G.titleSel = 0; G.script = null; G.dialog = null; render(); },
    create: function () { openCreate(); render(); },
    createLook: function (look, name) {
      var C2 = G.create; if (!C2) return null;
      for (var k in look) C2.look[k] = look[k];
      if (name !== undefined) C2.name = cleanName(name);
      CH.define('me', heroDef(C2.look)); render();
      return { look: C2.look, name: C2.name };
    },
    createDone: function () { if (G.create) finishCreate(); },
    /* the endless run: start one as a named hero, read where it stands */
    endless: function (name, look) { applyHero(look || PRESETS.luna, name || 'Ayşe'); G.heroId = 'me'; startEndless(); render(); },
    endlessRoom: function (k) { if (G.endless) { G.fade = null; enterRoom(k); render(); } },
    endlessState: function () {
      var E = G.endless;
      return E ? { mode: G.mode, score: E.score, best: E.best, over: !!E.over, rank: E.rank, newBest: E.newBest, rows: (E.rows || []).length } : { mode: G.mode };
    },
    typeName: function (on) { if (on) startTyping(); else stopTyping(); },
    cleanName: cleanName,
    /* run the story to its end: lines are read, questions answered right,
     * walks and flights finish */
    skipScript: function () {
      var n = 0;
      while (G.script && n++ < 600) {
        var st = G.script.steps[G.script.i];
        if (st.choose) { if (!G.choice || !G.choice.reply) { G.dialog.t = 99; pickChoice(st.choose.free ? 0 : st.choose.answer); } nextStep(); }
        else if (st.line || st.cutin || st.whisper || st.card) { G.cutin = null; G.whisper = null; G.card = null; nextStep(); }
        else { var guard = 0; while (G.script && G.script.steps[G.script.i] === st && guard++ < 2000) { if (st.run(STEP, G.script.s)) { if (st.end) st.end(); nextStep(); } } }
      }
    },
    choose: function (i) { if (G.dialog) G.dialog.t = 99; pickChoice(i); this.step(1); return G.choice && G.choice.reply; },
    warp: function (i) {
      var st = G.stations[i];
      if (st.zone !== G.zone) enterZone(st.zone);
      G.mode = 'play'; G.fade = null;
      G.script = null; G.dialog = null; G.choice = null; G.cutin = null; G.whisper = null; G.reading = null; G.photo = null; G.picture = null; G.card = null;
      G.npcs = G.npcs.filter(function (p) { return !p.intro; }); G.grabbo = null; G.flyers = []; G.hero.expr = null; tidy();
      for (var k = 0; k < i; k++) { var o = G.stations[k]; o.state = 'done'; o.gateOpen = 1; }
      st.beatDone = true;   // a test goes straight to the challenge
      G.hero.x = st.x0 + 40; G.hero.y = GY - G.hero.h; G.hero.safe = { x: G.hero.x, y: GY - G.hero.h }; G.cam.x = st.x0;
      this.step(30);
    },
    answer: function (right) {
      var self = this, h = G.hero;
      if (G.script) { this.skipScript(); this.step(2); }
      var B = G.boss;
      if (B && !G.active) {   // the rooftop: go to a word and catch it
        for (var w = 0; w < 400 && B.phase !== 'round'; w++) this.step(2);
        if (B.phase !== 'round') return 'boss ' + B.phase;
        for (var w2 = 0; w2 < 200 && B.bubbles.some(function (o) { return o.fly > 0; }); w2++) this.step(1);
        var r = B.rounds[B.i], bb = B.bubbles.filter(function (o) { return o.state === 'idle' && (right ? o.word === r.answer : o.word !== r.answer); })[0];
        if (!bb) return 'no bubble';
        h.x = bb.x - h.w / 2; h.y = bb.y - h.h / 2; h.vx = h.vy = 0;
        this.step(1, { act: true }); this.step(1, { act: false });
        if (right) for (var w3 = 0; w3 < 300 && B.phase === 'throw'; w3++) this.step(1);
        return 'boss ' + B.phase + ' ' + (B.i + 1);
      }
      var st = G.active; if (!st) return 'no station';
      // fetch / deliver: stand next to it, then press the interact key
      function standAt(x, off, feetY) {   // let go of the keys first: a jump still buffered would lift the hero off the ground
        Object.keys(keys).forEach(function (k) { keys[k] = false; }); h.jumpBuf = 0;
        h.x = x - h.w / 2 - (off || 14); h.y = (feetY || GY) - h.h; h.vx = h.vy = 0; self.step(2);
      }
      if (st.type === 'fetch') {
        var it = st.items.filter(function (o) { return right ? o.form === st.form : o.form !== st.form; })[0];
        standAt(it.x, 14, it.y); this.step(1, { act: true }); this.step(1, { act: false }); return st.state;
      }
      if (st.type === 'deliver') {
        var lost = st.items[0];
        if (!lost.carried) { standAt(lost.x); this.step(1, { act: true }); this.step(1, { act: false }); }
        var p = st.npcs.filter(function (n) { return n.cool <= 0 && (right ? ownerOf(n) === st.scene.owner : ownerOf(n) !== st.scene.owner); })[0];
        standAt(p.x, 24); this.step(1, { act: true }); this.step(1, { act: false }); return st.state;
      }
      if (st.type === 'read') {
        G.reading = null;
        if (!right) { bonk(st.blocks.filter(function (o) { return o.value !== st.answer; })[0]); this.step(1); return st.state; }
        var guard = 0;
        while (st.state === 'active' && guard++ < 600) {
          if (st.wait > 0) { this.step(4); continue; }
          bonk(st.blocks.filter(function (o) { return o.value === st.answer; })[0]); this.step(1);
        }
        return st.state;
      }
      if (st.type === 'spell') {
        if (!right) { bonk(st.blocks.filter(function (o) { return o.value !== st.answer && o.state !== 'right'; })[0]); this.step(1); return st.state; }
        while (st.state === 'active') {
          var nb = st.blocks.filter(function (o) { return o.state !== 'right' && o.value === st.answer; })[0];
          bonk(nb); this.step(1);
        }
        return st.state;
      }
      var b = st.blocks.filter(function (o) { return right ? o.value === st.answer : o.value !== st.answer; })[0];
      bonk(b); this.step(1); return st.state;
    },
    finishGates: function () { G.stations.forEach(function (s) { if (s.state === 'solved') { s.gateOpen = 1; s.state = 'done'; } }); G.active = null; G.pip.perch = null; },
    results: function () { showResults(); render(); },
    enterZone: function (k) { enterZone(k); zoneIntro(); },
    save: function () { return loadSave(); },
    touch: function (on) { G.touch = on; },
    closeBook: function () { closeBook(); },
    runStep: RUN_STEP,
    heroSprite: function () { return heroLook(); },
    boss: function () { var B = G.boss; return B ? { phase: B.phase, round: B.i, rounds: B.rounds.length, bubbles: B.bubbles.map(function (o) { return o.word + ':' + o.state; }) } : null; }
  };
  window.READY = true;
})();

</script>
</body>
