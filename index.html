  /* Subject, place or person? A word on a board: "Music is a ___." */
  function setupSort(st, cat) {
    var sc = st.scene = C.sortScene(cat);
    st.poster = { x: st.x0 + 104, text: sc.word };
    blockRow(st, sc.options, 176, 444);
    st.answer = sc.answer;
    st.banner = { who: 'pip', caption: 'Subject, place or person?', before: sc.before, after: sc.after };
    st.speak = { who: 'pip', text: sc.word + '. Subject, place or person?' };
    st.full = sc.sentence;
  }

  /* ================================================================ collisions */
  function tileAt(cx, cy) {
    var l = G.lvl;
    if (cx < 0 || cy < 0 || cx >= l.w || cy >= l.h) return T.EMPTY;
    return l.tiles[cy * l.w + cx];
  }
  function tileSolid(cx, cy) {
    if (cx < 0) return true;
    var t = tileAt(cx, cy);
    return t === T.GROUND || t === T.BRICK;
  }
  function rectSolids() {
    var out = [];
    G.stations.forEach(function (st) {
      if (st.gateOpen < 0.6) out.push({ x: st.gateX + 1, y: -400, w: 14, h: GY + 400 });
      st.blocks.forEach(function (b) { out.push({ x: b.x, y: b.y, w: b.w, h: b.h, block: b }); });
    });
    return out;
  }
  function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  function moveHero(h, dt) {
    var solids = rectSolids(), i, s;
    h.x += h.vx * dt;
    var top = Math.floor(h.y / TS), bot = Math.floor((h.y + h.h - 1) / TS), cy;
    if (h.vx > 0) {
      var cr = Math.floor((h.x + h.w) / TS);
      for (cy = top; cy <= bot; cy++) if (tileSolid(cr, cy)) { h.x = cr * TS - h.w; h.vx = 0; break; }
    } else if (h.vx < 0) {
      var cl = Math.floor(h.x / TS);
      for (cy = top; cy <= bot; cy++) if (tileSolid(cl, cy)) { h.x = (cl + 1) * TS; h.vx = 0; break; }
    }
    for (i = 0; i < solids.length; i++) {
      s = solids[i];
      if (!overlap(h, s)) continue;
      if (h.x + h.w / 2 < s.x + s.w / 2) h.x = s.x - h.w; else h.x = s.x + s.w;
    }
    if (G.active && G.active.state !== 'done' && h.x < G.active.x0 + 2) h.x = G.active.x0 + 2;
    var zb = zoneOf(G.zone);
    if (h.x < zb.x0 + 2) h.x = zb.x0 + 2;
    if (h.x > zb.x1 - h.w - 2) h.x = zb.x1 - h.w - 2;

    var prevBottom = h.y + h.h, prevTop = h.y;
    h.y += h.vy * dt;
    h.onGround = false;
    var c0 = Math.floor((h.x + 1) / TS), c1 = Math.floor((h.x + h.w - 1) / TS), cx;
    if (h.vy >= 0) {
      var rowB = Math.floor((h.y + h.h) / TS);
      for (cx = c0; cx <= c1; cx++) {
        var t = tileAt(cx, rowB);
        if (t === T.GROUND || t === T.BRICK || (t === T.PLANK && prevBottom <= rowB * TS + 0.5)) {
          h.y = rowB * TS - h.h; h.vy = 0; h.onGround = true; break;
        }
      }
    } else {
      var rowT = Math.floor(h.y / TS);
      for (cx = c0; cx <= c1; cx++) if (tileSolid(cx, rowT)) { h.y = (rowT + 1) * TS; h.vy = 20; snd.play('bonk'); break; }
    }
    // the things that move: land on their tops from above (a plank that rose this frame is allowed for)
    h.on = null;
    if (h.vy >= 0 && !h.onGround) {
      var plats = platforms();
      for (i = 0; i < plats.length; i++) {
        var pl = plats[i];
        if (h.x + h.w - 2 <= pl.x || h.x + 2 >= pl.x + pl.w) continue;
        if (prevBottom <= pl.top + 0.5 + pl.lift && h.y + h.h >= pl.top) { h.y = pl.top - h.h; h.vy = 0; h.onGround = true; h.on = pl.ref; break; }
      }
    }
    for (i = 0; i < solids.length; i++) {
      s = solids[i];
      if (!overlap(h, s)) continue;
      if (prevBottom <= s.y + 0.5) { h.y = s.y - h.h; h.vy = 0; h.onGround = true; }
      else if (prevTop >= s.y + s.h - 0.5) {
        h.y = s.y + s.h; h.vy = 30;
        if (s.block) bonk(s.block); else snd.play('bonk');
      }
    }
  }

  /* ================================================================ things that move
   * Planks that go to and fro, trampolines, books that give way, tray belts,
   * Hush's ink on the floor, the bonus stars. You land on the platforms from
   * above and jump up through them from below; a plank or a belt carries
   * whoever stands on it; a trampoline throws you high; a stack of books
   * shakes, gives way and comes back. Touching the ink is like falling in a
   * pit: back to the last safe place, nothing lost. */
  var SPRING_V = -560, BELT_V = 42, SHAKE_T = 0.6, GONE_T = 2.6, BONUS = 5;
  /** move the planks along their paths (eased at the ends, so they are easy to step on) */
  function moveThings(dt) {
    G.movers.forEach(function (m) {
      var k = 0.5 - 0.5 * Math.cos((G.t / m.period + m.phase) * Math.PI * 2);
      var nx = m.x0 + m.dx * k, ny = m.y0 + m.dy * k;
      m.mx = nx - m.x; m.my = ny - m.y; m.x = nx; m.y = ny;
    });
    G.springs.forEach(function (sp) { if (sp.squash > 0) sp.squash = Math.max(0, sp.squash - dt * 3); });
    G.crumbles.forEach(function (c) {
      c.t += dt;
      if (c.state === 'shake' && c.t >= SHAKE_T) { c.state = 'fall'; c.t = 0; snd.play('crack'); }
      else if (c.state === 'fall') {
        c.y = c.y0 + 300 * c.t * c.t;
        if (c.t >= GONE_T) {   // it comes back where it was, unless someone stands in its place
          var h = G.hero, spot = { x: c.x, y: c.y0, w: c.w, h: 16 };
          c.y = c.y0;
          if (!overlap(h, spot)) { c.state = 'back'; c.t = 0; }
        }
      } else if (c.state === 'back' && c.t >= 0.4) { c.state = 'idle'; c.t = 0; }
    });
  }
  /** the tops you can stand on: { x, w, top, ref, lift } (lift: how far it rose this frame) */
  function platforms() {
    var out = [];
    G.movers.forEach(function (m) { out.push({ x: m.x, w: m.w, top: m.y, ref: m, lift: Math.max(0, -m.my) }); });
    G.crumbles.forEach(function (c) { if (c.state === 'idle' || c.state === 'shake') out.push({ x: c.x, w: c.w, top: c.y, ref: c, lift: 0 }); });
    G.belts.forEach(function (b) { out.push({ x: b.x, w: b.w, top: b.y, ref: b, lift: 0 }); });
    return out;
  }
  /** a trampoline throws you up whether you fall on it or walk onto it */
  function springAt(h) {
    if (h.vy < 0 || h.frozen) return null;
    var feet = h.y + h.h;
    for (var i = 0; i < G.springs.length; i++) {
      var sp = G.springs[i];
      if (feet < sp.y - 16 || feet > sp.y + 1) continue;
      if (h.x + h.w - 3 <= sp.x - 18 || h.x + 3 >= sp.x + 18) continue;
      return sp;
    }
    return null;
  }
  /** is the hero touching Hush's ink? (the feet on the floor, over a puddle) */
  function inInk(h) {
    if (h.y + h.h < GY - 1) return false;
    return G.puddles.some(function (p) { return h.x + h.w - 3 > p.x + 2 && h.x + 3 < p.x + p.w - 2; });
  }
  function nearInk(x0, x1) { return G.puddles.some(function (p) { return x1 > p.x - 10 && x0 < p.x + p.w + 10; }); }

  /* ================================================================ stations */
  var PERCH = { dx: 32, y: GY - 42 };
  function activate(st) {
    st.state = 'active'; G.active = st;
    if (perches(st)) G.pip.perch = { x: st.x0 + PERCH.dx, y: PERCH.y };
    say(st.speak.who, st.speak.text);
    if (st.type === 'question' && !G.toldAsk) { G.toldAsk = true; G.tip = { text: 'Read the answer. Make the question!', t: 6 }; }
    if (st.type === 'say' && st.firstStation) G.tip = { text: 'Jump and hit a block!', t: 6 };
    if (st.type === 'read') openBook(st);
    // the first time something must be taken: how to use the interact key
    if ((st.type === 'fetch' || st.type === 'deliver') && !G.toldAct) {
      G.toldAct = true;
      G.tip = { text: G.touch ? 'Go to it and tap the hand' : 'Go to it and press  E', t: 6 };
    }
  }
  function perches(st) { return st.type === 'say' || st.type === 'fetch' || st.type === 'deliver' || st.type === 'sort'; }
  function bonk(b) {
    b.bump = 4;
    var st = b.st;
    if (st.state !== 'active' || b.state === 'right' || b.t > 0) { snd.play('bonk'); return; }
    if (st.type === 'read') {
      if (st.wait > 0) { snd.play('bonk'); return; }
      var q = st.reading.qs[st.qi];
      if (b.value === st.answer) {
        b.state = 'right'; st.blocks.forEach(function (o) { if (o !== b) o.state = 'used'; o.glow = false; });
        burst(b.x + b.w / 2, b.y, '#a6f0a0', 14); snd.play('right');
        count(st.zone, 'read', st.qMistakes === 0, q.q + ' ' + q.answer);
        st.banner.ok = true; st.banner.hint = null; st.banner.reply = q.answer + (q.why ? '. ' + q.why : '');
        say('hero', q.answer + (q.why ? '. ' + q.why : '.'));
        G.hero.cheer = 0.6;
        st.wait = 1.6;   // then the next question, or the gate
      } else {
        st.qMistakes++;
        wrong(st, b, 'Read again! Press E at the book.', 'pip');
        st.bookGlow = true;
      }
      return;
    }
    if (st.type === 'spell') {
      if (b.value !== st.word[st.pos]) { wrong(st, b); return; }
      b.state = 'right'; b.glow = false; st.pos++; st.banner.got = st.pos; snd.play('pick');
      burst(b.x + b.w / 2, b.y, '#a6f0a0', 6);
      if (st.pos >= st.word.length) { solve(st, b); return; }
      st.answer = st.word[st.pos];
      if (st.mistakes >= 2) st.blocks.forEach(function (o) { o.glow = o.state !== 'right' && o.value === st.answer; });
      return;
    }
    if (b.value === st.answer) solve(st, b);
    else wrong(st, b);
  }
  function solve(st, b) {
    st.state = 'solved';
    if (b) { b.state = 'right'; st.blocks.forEach(function (o) { if (o !== b && o.state !== 'right') { o.state = 'used'; } o.glow = false; }); burst(b.x + b.w / 2, b.y, '#a6f0a0', 18); }
    st.banner.filled = st.answer; st.banner.ok = true; st.banner.hint = null;
    snd.play('right');
    var first = st.mistakes === 0;
    count(st.zone, st.type, first, st.full || st.banner.text);
    var who = st.type === 'say' || st.type === 'fetch' || st.type === 'sort' ? 'pip' : st.type === 'yesno' || st.type === 'question' ? 'hero' : st.banner.who;
    if (st.type === 'yesno') { st.banner.reply = st.full; }
    if (st.full) say(who, (first || st.type === 'question' ? (st.type === 'question' ? '' : 'Yes! ') : '') + st.full);
    if (st.type === 'question') { bubble(G.hero, st.full, 1.6); st.replyIn = 1.5; }
    musicNote(st);
    st.npcs.forEach(function (p) { p.cheer = 1.6; });
    G.hero.cheer = 0.9;
    st.openIn = 1.3;
  }
  function wrong(st, b, hintText, hintWho) {
    if (G.endless) { endlessOver(st, b); return; }   // in a run the first mistake ends it
    st.mistakes++;
    snd.play('wrong');
    G.flash = 0.25;
    if (b) { b.state = 'wrong'; b.t = 0.7; }
    var hint = hintText, who = hintWho || 'pip';
    if (!hint) {
      if (st.type === 'spell') { hint = 'Listen: ' + st.word + '!'; }
      else if (st.type === 'say') { hint = C.demoHint(st.form, C.FORMS[b.value.split(' ')[0].toLowerCase()], st.noun); st.legend = true; }
      else if (st.type === 'own') { hint = st.scene.hint; who = st.scene.speaker; }
      else if (st.type === 'question') { hint = st.scene.hint; who = 'pip'; }
      else if (st.type === 'sort') { hint = st.scene.hint; who = 'pip'; }
      else if (st.type === 'yesno') {
        var wantThey = /they/.test(st.answer), saidThey = /they/.test(b.value);
        hint = wantThey !== saidThey ? st.scene.countHint : st.scene.ownerHint; who = 'batuhan';
      }
    }
    st.banner.hint = hint;
    say(who, hint);
    var tries = st.type === 'read' ? st.qMistakes : st.mistakes;
    st.npcs.forEach(function (p) { if (who === p.who || (who === 'twins' && ownerOf(p) === 'twins')) emote(p, '?'); });
    if (tries >= 2) {
      st.blocks.forEach(function (o) { o.glow = o.state !== 'right' && o.value === st.answer; });
      if (st.type === 'deliver') st.npcs.forEach(function (p) { p.glow = ownerOf(p) === st.scene.owner; });
      if (st.type === 'fetch') st.items.forEach(function (it) { it.glow = it.form === st.form; });
    }
  }
  function ownerOf(p) { return p.who === 'bo' || p.who === 'bea' ? 'twins' : p.who; }

  function updateStation(st, dt) {
    var h = G.hero;
    if (st.state === 'idle' && !G.script && h.x + h.w / 2 > st.x0 + 22) {
      // some stations open with a little story first ("What is this wall?")
      if (st.beat && !st.beatDone && BEATS[st.beat]) { st.beatDone = true; G.active = st; h.vx = 0; startScript(BEATS[st.beat](st), function () { activate(st); }); }
      else activate(st);
    }
    if (st.replyIn > 0) {   // the classmate answers the hero's question
      st.replyIn -= dt;
      if (st.replyIn <= 0 && st.speakerNpc) { bubble(st.speakerNpc, st.scene.reply, 2.6); say(st.scene.who, st.scene.reply); emote(st.speakerNpc, '♪'); }
    }
    st.blocks.forEach(function (b) {
      b.bump = Math.max(0, b.bump - dt * 30);
      if (b.t > 0) { b.t -= dt; if (b.t <= 0 && b.state === 'wrong') b.state = 'idle'; }
    });
    if (st.type === 'read' && st.wait > 0) {
      st.wait -= dt;
      if (st.wait <= 0) {
        st.qi++;
        if (st.qi < st.reading.qs.length) loadQuestion(st);
        else {   // every question answered: the words come back, the gate melts
          st.state = 'solved'; st.banner.caption = 'Well read!'; st.banner.hint = null;
          st.npcs.forEach(function (p) { p.cheer = 1.6; emote(p, '♥'); });
          snd.play('win'); st.openIn = 0.8;
        }
      }
    }
    if (st.openIn > 0) {
      st.openIn -= dt;
      if (st.openIn <= 0) {
        st.opening = true; snd.play('gate');
        if (st.firstStation) { bubble(G.pip, 'Look! It melts! Tweet!', 2.6); say('pip', 'Look! It melts!'); }
      }
    }
    if (st.opening && st.gateOpen < 1) {
      st.gateOpen = Math.min(1, st.gateOpen + dt * 1.2);
      if (Math.random() < 0.6) burst(st.gateX + 8, GY - GY * (1 - st.gateOpen), '#c9a7f5', 1);
      if (st.gateOpen >= 1) { st.state = 'done'; if (G.active === st) { G.active = null; G.pip.perch = null; } }
    }
    st.items.forEach(function (it) {
      if (it.cool > 0) it.cool -= dt;
      if (it.fly && it.fly > 0) {   // a right answer flies to Pip
        it.fly = Math.max(0, it.fly - dt * 1.6);
        var k = 1 - it.fly, px = st.x0 + PERCH.dx, py = PERCH.y - 4;
        it.x = it.fx + (px - it.fx) * k; it.y = it.fy + (py - it.fy) * k - Math.sin(k * Math.PI) * 34;
        if (it.fly === 0) { it.gone = true; it.fly = -1; burst(px, py - 6, '#ffd23f', 10); }
      }
    });
  }
  function count(zone, type, first, sentence) {
    G.score.total++; if (first) G.score.right++;
    var z = G.score.zones[zone]; z.total++; if (first) z.right++;
    G.score.log.push({ type: type, zone: zone, ok: first, sentence: sentence });
    if (G.endless && first && !G.endless.over) endlessPoint();
  }
  function solveSilently(st) {
    st.state = 'solved'; snd.play('right');
    var first = st.mistakes === 0;
    count(st.zone, st.type, first, st.full);
    st.banner.ok = true; st.banner.hint = null;
    st.npcs.forEach(function (p) { p.cheer = 1.6; });
    st.openIn = 1.6;
  }

  /* ================================================================ interact
   * Nothing happens by walking into it. Stand next to a thing or a person and
   * press the interact key (E / Enter, or the hand button): take a thing,
   * give what you carry, or talk. G.target is what the key would act on now. */
  var TALK = {
    mia: 'Hi! I am Mia. I am a girl.',
    max: 'Hi! I am Max. I am a boy.',
    bo: 'We are Bo and Bea. We are twins!',
    bea: 'We are Bo and Bea. We are twins!'
  };
  function findTarget() {
    var h = G.hero, hx = h.x + h.w / 2, best = null, bd = 1e9;
    if (G.script) return null;
    var feet = h.y + h.h, onGround = Math.abs(feet - GY) <= 10;
    function offer(t, d, range) { if (d <= range && d < bd) { bd = d; best = t; } }
    var B = G.boss;
    if (B && B.phase === 'round') B.bubbles.forEach(function (bb) {   // the rooftop: catch a word, in the air too
      if (bb.state !== 'idle' || bb.fly > 0) return;
      offer({ kind: 'bubble', b: bb, x: bb.x, top: bb.y - 14, verb: 'Catch' }, Math.hypot(bb.x - hx, bb.y - (h.y + h.h / 2)), 30);
    });
    var st = G.active;
    if (st && st.state === 'active') {
      if (st.type === 'fetch') st.items.forEach(function (it) {
        if (!it.gone && !it.fly && it.cool <= 0 && Math.abs(feet - it.y) <= 8) offer({ kind: 'item', st: st, it: it, x: it.x, top: it.y - itemTall(it) - 2, verb: 'Take' }, Math.abs(it.x - hx), it.many ? 30 : 22);
      });
      if (st.type === 'deliver' && !h.carry && !st.items[0].carried) {
        var lost = st.items[0];
        if (onGround) offer({ kind: 'item', st: st, it: lost, x: lost.x, top: GY - itemTall(lost) - 2, verb: 'Take' }, Math.abs(lost.x - hx), 24);
      }
      if (onGround && G.pip.perch && Math.abs(G.pip.x - G.pip.perch.x) < 3) offer({ kind: 'pip', st: st, x: G.pip.perch.x, top: G.pip.perch.y - 20, verb: 'Talk' }, Math.abs(G.pip.perch.x - hx), 16);
      if (onGround && st.type === 'read') offer({ kind: 'book', st: st, x: st.book.x, top: GY - 46, verb: 'Read' }, Math.abs(st.book.x - hx), 24);
    }
    if (!onGround) return best;
    G.lvl.decor.forEach(function (d) {
      if (d.kind === 'clue' && d.seen) offer({ kind: 'clue', d: d, x: d.x + 8, top: GY - 50, verb: 'Look' }, Math.abs(d.x + 8 - hx), 22);
    });
    G.npcs.forEach(function (p) {
      if (p.intro || p.cool > 0) return;
      var giving = h.carry && st && st.type === 'deliver' && st.state === 'active' && st.npcs.indexOf(p) >= 0;
      offer({ kind: 'npc', p: p, x: p.x, top: headTop(p) - 2, verb: giving ? 'Give' : 'Talk', give: giving }, Math.abs(p.x - hx), 30);
    });
    return best;
  }
  function interact(t) {
    if (!t) return;
    var h = G.hero;
    if (t.kind === 'item') {
      var st = t.st, it = t.it;
      if (st.type === 'deliver') {
        it.carried = true; h.carry = { item: it.name, many: it.many }; snd.play('pick');
        burst(it.x, GY - 10, '#ffffff', 6);
        return;
      }
      if (it.form === st.form) {
        it.fly = 1; it.fx = it.x; it.fy = it.y; burst(it.x, it.y - 12, '#ffffff', 12);
        st.items.forEach(function (o) { o.glow = false; });
        snd.play('pick'); solve(st, null);
      } else {
        it.cool = 1.2; burst(it.x, it.y - 12, '#ff9a9a', 8);
        wrong(st, null, 'No! ' + C.demoSentence(it.form, st.noun) + ' ' + C.bringMe(st.form, st.noun));
        st.legend = true;
      }
      return;
    }
    if (t.kind === 'pip') {
      var s = t.st.speak; say(s.who, s.text); bubble(G.pip, s.text, 2.6);
      return;
    }
    if (t.kind === 'book') { openBook(t.st); return; }
    if (t.kind === 'bubble') { bossCatch(t.b); return; }
    if (t.kind === 'clue') {   // look again: the old photo, or Grabbo's drawing
      G.photo = { t: 0, kind: t.d.clue || 'drawing' };
      var again = t.d.clue === 'photo' ? 'Is this... Batuhan Teacher?' : 'Poor Grabbo. He is sad.';
      bubble(G.pip, again, 4); say('pip', again);
      emote(G.hero, '?', 3);
      return;
    }
    var p = t.p;
    if (t.give) { give(G.active, p); return; }
    // talk: the person faces you and says who they are (his / her / their)
    var line, who = p.who;
    var yn = G.stations.filter(function (s2) { return s2.state === 'active' && s2.speakerNpc === p && s2.type === 'yesno'; })[0];
    if (yn) line = yn.speak.text;
    else if (G.boss && who === 'batuhan') line = 'Catch the right word, ' + heroName() + '!';
    else if (G.boss) line = 'Go, ' + heroName() + '! You can do it!';
    else if (who === 'batuhan') line = 'Hello, ' + heroName() + '! Please find our things!';
    else line = TALK[who] || 'Hi!';
    if (who === 'bo' || who === 'bea') who = 'twins';
    if (!G.stations.some(function (s2) { return s2.state === 'active' && s2.npcs.indexOf(p) >= 0 && s2.type !== 'deliver'; }))
      p.face = h.x + h.w / 2 < p.x ? -1 : 1;
    bubble(p, line, 2.8); say(who, line);
    p.cool = 0.4;
  }
  function give(st, p) {
    var h = G.hero, lost = st.items[0], who = ownerOf(p);
    if (who === st.scene.owner) {
      h.carry = null;
      st.npcs.forEach(function (q) { if (ownerOf(q) === who) q.hold = who === 'twins' ? twinHold({ item: lost.name, many: lost.many }, q.who === 'bea' ? 1 : 0) : { item: lost.name, many: lost.many }; q.glow = false; });
      bubble(p, st.scene.thanks(who)); say(who === 'twins' ? 'twins' : p.who, st.scene.thanks(who));
      st.npcs.forEach(function (q) { if (ownerOf(q) === who) emote(q, '♥'); });
      st.full = st.scene.sentence;
      solveSilently(st);
    } else {
      st.npcs.forEach(function (q) { if (ownerOf(q) === who) q.cool = 1.2; });
      bubble(p, st.scene.notMine(who));
      emote(p, '?');
      wrong(st, null, st.scene.notMine(who), who === 'twins' ? 'twins' : p.who);
    }
  }

  /* ================================================================ effects + talk */
  function dust(x, y, n, dir) {
    for (var i = 0; i < n; i++) {
      G.parts.push({ x: x + (Math.random() - 0.5) * 6, y: y - 1, vx: (dir || (Math.random() < 0.5 ? -1 : 1)) * (15 + Math.random() * 30),
        vy: -10 - Math.random() * 20, life: 0.25 + Math.random() * 0.2, c: Math.random() < 0.5 ? '#f4e6d4' : '#cdb894', g: 40 });
    }
  }
  function burst(x, y, c, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 80;
      G.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.4, c: c });
    }
  }
  function bubble(ent, text, t) {
    G.bubbles = G.bubbles.filter(function (b) { return b.ent !== ent; });
    G.bubbles.push({ ent: ent, text: text, t: t || 3.2 });
  }
  function emote(ent, kind, t) {
    G.emotes = G.emotes.filter(function (e) { return e.ent !== ent; });
    G.emotes.push({ ent: ent, kind: kind, t: t || 1.6 });
  }
  /* Nobody speaks out loud (owner, 2026-11-05): the dialog box mumbles letter
   * by letter as it types (updateScript); words that appear all at once (a
   * bubble, a hint, a station's instruction) get a short babble. */
  function say(who, text) {
    if (G.dialog && G.dialog.text === text) return;   // the dialog box mumbles as it types
    snd.babble(voiceOf(who), text);
  }
  var LETTER = /[A-Za-zÇçĞğİıÖöŞşÜü0-9]/;
  /** blip every other letter as typed text appears; a jump ahead (skipped) makes no burst */
  function typeBlips(o, shown, who) {
    if (o.blip === undefined) { o.blip = 0; o.n = 0; }
    shown = Math.min(o.text.length, shown);
    if (shown - o.blip > 4) { o.blip = shown; return; }
    while (o.blip < shown) { var ch = o.text.charAt(o.blip++); if (LETTER.test(ch) && (o.n++ % 2) === 0) snd.mumble(who, ch); }
  }
  /* the music room: every right answer puts a note back */
  function musicNote(st) {
    var z = zoneOf(st.zone);
    if (!z.split || z.theme2 !== 'music' || st.x0 < z.split) return;
    snd.play('note');
    for (var i = 0; i < 7; i++) G.notesFx.push({ x: st.gateX - 60 + Math.random() * 70, y: GY - 40 - Math.random() * 50, vy: -18 - Math.random() * 18,
      t: 1.4 + Math.random() * 0.8, c: ['#e04848', '#3a86ff', '#57cc99', '#ffc93c', '#9b5de5'][i % 5] });
  }

  /* ================================================================ story
   * A script is a list of steps:
   *   { line: [who, text], expr, emote, pose }   a dialog line (typed out)
   *   { choose: { who, q, options, answer, retry, point } } a question to answer
   *   { choose: { ..., free: true, replies } }   a story question: every answer is fine and gets its own reply
   *   { cutin: { text, dur, expr } }              Grabbo's comic panel
   *   { whisper: { text, dur } }                  Hush
   *   { card: { text, sub, dur } }                a full-screen title card
   *   { run: fn(dt, s), start, end }              anything that moves
   * Any step may carry pic: 'drawing' | 'photo' (a picture shown during the
   * scene; null hides it) and point: an entity or a cast name.
   */
  function lineStep(who, text, o) { var s = { line: [who, text] }; for (var k in o) s[k] = o[k]; return s; }
  function castFind(who) {
    if (who === 'hero') return G.hero;
    if (who === 'pip') return G.pip;
    if (who === 'grabbo') return G.grabbo;
    return G.npcs.filter(function (n) { return n.who === who && n.intro; })[0] || G.npcs.filter(function (n) { return n.who === who && n.cast; })[0] ||
      G.npcs.filter(function (n) { return n.who === who; })[0];
  }
  function pointOf(p) { return typeof p === 'string' ? castFind(p) : p; }
  function castEach(who, fn) {
    if (who === 'twins') { ['bo', 'bea'].forEach(function (w) { var n = castFind(w); if (n) fn(n); }); return; }
    var n = castFind(who); if (n) fn(n);
  }
  function walkTo(n, x, speed, faceAfter) {   // a run step: someone walks to x
    return { run: function (dt) {
      var d = x - n.x; if (Math.abs(d) < 1.5) { n.x = x; n.walking = false; if (faceAfter) n.face = faceAfter; return true; }
      n.walking = true; n.face = d > 0 ? 1 : -1; n.x += Math.sign(d) * Math.min(Math.abs(d), (speed || 70) * dt); n.walkDist = (n.walkDist || 0) + (speed || 70) * dt;
      return false;
    } };
  }
  function wait(t) { return { run: function (dt, s) { s.k = (s.k || 0) + dt; return s.k >= t; } }; }

  /* The first day: the new kid meets Batuhan Teacher and the class (the unit's
   * questions, answered by choosing), then Grabbo takes everybody's things. */
  function introYard() {
    var h = G.hero, x = h.x, hn = heroName();
    var teacher = npc('batuhan', 134, 1), mia = npc('mia', 236, -1, { item: 'bag' }),
        max = npc('max', 270, -1, { item: 'ball' }), bo = npc('bo', 306, -1, { item: 'crayon' }),
        bea = npc('bea', 330, -1, { item: 'crayon' });
    teacher.hidden = true;
    var cast = [teacher, mia, max, bo, bea];
    cast.forEach(function (p) { p.intro = true; G.npcs.push(p); });
    var kids = [mia, max, bo, bea];
    var gb;
    return [
      { run: function (dt, s) { s.k = (s.k || 0) + dt; return s.k > 0.4; } },
      lineStep('pip', 'Tweet! Look! This is our new school!', { expr: 'happy', emote: '♪' }),
      lineStep('hero', 'I am new here, Pip.', { expr: 'worried' }),
      { run: function () { teacher.hidden = false; teacher.x = 134; return true; }, start: function () { snd.play('blip'); } },
      walkTo(teacher, x + 56, 50, -1),
      lineStep('batuhan', 'Hello! I am Batuhan Teacher.', { expr: 'happy', pose: 'wave' }),
      { choose: { who: 'batuhan', q: 'What is your name?', options: ['My name is ' + hn + '.', 'I am seven.', 'I am fine, thank you.'], answer: 0, retry: 'Hmm? What is your name?' } },
      lineStep('batuhan', 'Nice to meet you, ' + hn + '!', { expr: 'happy' }),
      { choose: { who: 'batuhan', q: 'How old are you?', options: ['I am seven.', 'I am from Turkey.', 'My name is ' + hn + '.'], answer: 0, retry: 'Hmm? How old are you?' } },
      { choose: { who: 'batuhan', q: 'Where are you from?', options: ['I am from Turkey.', 'I am seven.', 'Yes, it is.'], answer: 0, retry: 'Hmm? Where are you from?' } },
      lineStep('batuhan', 'Welcome to Bluebird School!', { expr: 'happy', pose: 'wave' }),
      lineStep('batuhan', 'This is Mia. She is in your class.', { expr: 'happy', point: mia }),
      lineStep('mia', '...Hi.', { expr: 'worried', emote: '…' }),
      lineStep('batuhan', 'And this is Max.', { expr: 'happy', point: max }),
      lineStep('max', 'Hi! This is my ball!', { expr: 'happy', pose: 'carry' }),
      lineStep('batuhan', 'These are Bo and Bea. They are twins.', { expr: 'happy', point: bo }),
      lineStep('twins', 'Hello! These are our crayons!', { expr: 'happy' }),
      { choose: { who: 'pip', q: 'Who is this?', options: ['This is Max.', 'This is Mia.', 'This is Batuhan Teacher.'], answer: 0, retry: 'Look again! Who is this?', point: max } },
      // Grabbo!
      { run: function (dt, s) {
          if (!s.init) {
            s.init = true; gb = G.grabbo = { x: x + 420, y: 40, frame: 0, sack: [], expr: 'neutral' };
            snd.play('grabbo'); kids.concat([teacher]).forEach(function (p) { p.expr = 'surprised'; emote(p, '!', 2.4); });
            h.expr = 'surprised'; emote(h, '!', 2.4);
          }
          gb.x += (x + 300 - gb.x) * Math.min(1, dt * 3); gb.y += (GY - 116 - gb.y) * Math.min(1, dt * 3);
          return Math.abs(gb.x - (x + 300)) < 2;
        } },
      { cutin: { text: 'MINE! MINE!', dur: 2.0 } },
      lineStep('grabbo', 'Mine! Mine! All mine!', { expr: 'neutral' }),
      { choose: { who: 'pip', q: 'Who is that?!', options: ['That is Grabbo!', 'That is Max.', 'That is a bird.'], answer: 0, retry: 'Look! Who is that?', point: 'grabbo' } },
      { run: function (dt, s) {   // he swoops along the kids and their things fly into his pocket
          s.k = (s.k || 0) + dt;
          gb.x = x + 300 - s.k * 110; gb.y = GY - 98 + Math.sin(s.k * 5) * 8;
          kids.forEach(function (p) {
            if (p.hold && gb.x < p.x + 8) {
              G.flyers.push({ item: p.hold.item, many: false, x: p.x + 6 * p.face, y: GY - 16, tx: function () { return gb.x + 4; }, ty: function () { return gb.y + 4; }, t: 0 });
              p.hold = null; p.expr = 'sad'; snd.play('pick');
            }
          });
          return s.k > 2.4;
        } },
      { run: function (dt) { gb.x += dt * 280; gb.y -= dt * 70; return gb.x > G.cam.x + VW + 70; }, end: function () { G.grabbo = null; } },
      lineStep('mia', 'Hey! That is my bag!', { expr: 'sad' }),
      lineStep('max', 'And that is my ball!', { expr: 'angry' }),
      lineStep('twins', 'Those are our crayons!', { expr: 'sad' }),
      lineStep('batuhan', 'Oh no! Grabbo has our things.', { expr: 'worried' }),
      lineStep('batuhan', hn + ', can you help us?', { expr: 'worried' }),
      lineStep('hero', 'Yes! Let\'s go, Pip!', { expr: 'happy', pose: 'cheer' }),
      lineStep('pip', 'Tweet! Let\'s go!', { expr: 'happy' }),
      castLeaves(cast, function () { G.tip = { text: G.touch ? 'Go right!' : '← →  move     Space  jump     E  talk', t: 6 }; })
    ];
  }
  function tidy() {   // forget emotes and bubbles of anyone no longer here
    var here = function (e) { return e === G.hero || e === G.pip || e === G.grabbo || G.npcs.indexOf(e) >= 0; };
    G.emotes = G.emotes.filter(function (e) { return here(e.ent); });
    G.bubbles = G.bubbles.filter(function (b) { return here(b.ent); });
  }
  function castLeaves(cast, after) {
    return { run: function (dt, s) {
        s.k = (s.k || 0) + dt;
        cast.forEach(function (p, i) { if (s.k > i * 0.15) { p.face = 1; p.x += dt * 140; p.walking = true; p.walkDist = (p.walkDist || 0) + dt * 140; p.hold = null; } });
        return s.k > 2.2;
      }, end: function () { G.npcs = G.npcs.filter(function (p) { return !p.intro; }); G.hero.expr = null; G.emotes = []; tidy(); if (after) after(); } };
  }
  /* Grabbo pops up over the zone's door, says his line, and escapes. */
  function grabboEscape(lines, expr) {
    var door = zoneOf(G.zone).doorX;
    var gb = G.grabbo = { x: door + 220, y: 30, frame: 0, sack: [], expr: expr || 'neutral', hush: expr === 'hush' ? 1 : 0 };
    var steps = [
      { run: function (dt) { gb.x += (door + 14 - gb.x) * Math.min(1, dt * 3); gb.y += (GY - 124 - gb.y) * Math.min(1, dt * 3); return Math.abs(gb.x - door - 14) < 2; },
        start: function () { snd.play('grabbo'); G.npcs.forEach(function (p) { emote(p, '!'); }); emote(G.hero, '!'); } }
    ];
    steps.push(lines.shift());
    steps.push({ run: function (dt) { gb.x += dt * 240; gb.y -= dt * 80; return gb.y < -60; }, end: function () { G.grabbo = null; } });
    return steps.concat(lines);
  }
  var OUTROS = {
    yard: function () {
      return grabboEscape([
        lineStep('grabbo', 'Mine! Mine! You can\'t catch me!'),

   * Every right word frees one thing from the Pocket and some of the dark. */
  var BOSS_SPOTS = [176, 244, 312, 380, 446], BOSS_YS = [GY - 30, GY - 60, GY - 86];
  function startBoss() {

    gb.expr = 'hush'; gb.hush = 1;

  }
  function newBubble(B, word, k, fromX, fromY) {

    var free = [0, 1, 2, 3, 4].filter(function (s) { return used.indexOf(s) < 0; });
    var slot = free[Math.floor(Math.random() * free.length)];
    return { word: word, slot: slot, fx: fromX, fy: fromY, x: fromX, y: fromY, tx: B.x0 + BOSS_SPOTS[slot], ty: BOSS_YS[(slot + k + B.i) % 3], fly: 1, state: 'idle', phase: Math.random() * 6, glow: false };

  function bossRound(B) {
    B.i++;
    if (B.i >= B.rounds.length) { bossDown(B); return; }
    var r = B.rounds[B.i], gb = G.grabbo;
    B.mistakes = 0; B.legend = false; B.bubbles = [];

      B.show = { item: r.show.item, many: !!r.show.many, at: r.show.at, t: 0, fx: gb.x - 4, fy: gb.y + 10, x: gb.x - 4, y: gb.y + 10,
        gx: (spk ? spk.x : B.x0 + 100) + (r.who === 'twins' ? 18 : 12), landed: false };

    var B = G.boss, r = B.rounds[B.i], h = G.hero;

      bb.state = 'gone'; B.phase = 'throw';
      B.shots.push({ word: bb.word, x: h.x + h.w / 2, y: h.y + 10, sx: h.x + h.w / 2, sy: h.y + 10, t: 0 });
      B.bubbles.forEach(function (o) { if (o !== bb && o.state === 'idle') { o.state = 'pop'; o.t = 0; burst(o.x, o.y, '#e2d2ff', 6); } });

    snd.play('hit'); snd.play('right');
    burst(gb.x, gb.y, '#ffd64a', 18); burst(gb.x, gb.y, '#c9a7f5', 12);
    gb.hurt = 0.8; gb.hush = Math.max(0, 1 - (B.i + 1) / B.rounds.length);
    say(r.who, r.full);
    G.npcs.forEach(function (n) { if (n.cast) n.cheer = 1.2; });
    if (r.give) {   // the thing goes back to its owner: from Grabbo's claw, or picked up from the floor
      var to = r.give.to === 'twins' ? ['bo', 'bea'] : [r.give.to], sh = B.show;
      to.forEach(function (w, k) {
        var owner = castFind(w), many = r.give.to === 'twins' ? false : !!r.give.many;
        if (sh && sh.at === 'near') { owner.hold = { item: r.give.item, many: many }; emote(owner, '♥'); snd.play('pick'); burst(sh.x, GY - 8, '#ffffff', 8); return; }
        G.flyers.push({ item: r.give.item, many: many, x: sh ? sh.x : gb.x, y: sh ? sh.y - 8 : gb.y + 6, tx: function () { return owner.x; }, ty: function () { return GY - 18; }, t: -k * 0.15,
          land: function () { owner.hold = { item: r.give.item, many: many }; emote(owner, '♥'); snd.play('pick'); } });
      });
    }
    B.show = null; B.legend = false;
    G.npcs.forEach(function (n) { if (n.cast) n.pointing = false; });
    if (r.reply) B.replyIn = 1.2;
    B.phase = 'next'; B.wait = r.reply ? 3.4 : 2.4;
  }
  function bossDown(B) {
    B.phase = 'down'; B.bubbles = []; B.drops = [];
    G.hero.vx = 0; G.outro = true; G.tip = null;
    startScript(finale(), function () { G.outro = false; G.boss = null; showReport(); });
  }
  function updateBoss(dt) {
    var B = G.boss, gb = G.grabbo, h = G.hero;
    if (!B || !gb || B.phase === 'down') return;
    B.t += dt;
    var calm = B.phase === 'next' && B.i >= B.rounds.length - 1;
    var sh = B.show, holding = sh && sh.at === 'far';
    // holding a thing up he stays across the roof, far from the class
    gb.x += ((holding ? B.x0 + 372 + Math.sin(B.t * 0.7) * 44 : B.x0 + 300 + Math.sin(B.t * 0.7) * 110) - gb.x) * Math.min(1, dt * 2);
    gb.y = GY - 150 + Math.sin(B.t * 1.9) * 6;
    gb.face = h.x + h.w / 2 < gb.x ? -1 : 1;
    if (gb.hurt > 0) gb.hurt -= dt;
    if (sh) {
      sh.t += dt;
      if (sh.at === 'far') {   // out of the Pocket and up into his claw (the one on the class's side)
        var kf = Math.min(1, sh.t / 0.6), e1 = kf * (2 - kf), cxw = gb.x - 18, cyw = gb.y - 5;
        sh.x = sh.fx + (cxw - sh.fx) * e1; sh.y = sh.fy + (cyw - sh.fy) * e1 - Math.sin(kf * Math.PI) * 10;
        if (kf >= 1) { sh.x = cxw + Math.round(Math.sin(G.t * 6) * 1); sh.y = cyw + Math.round(Math.sin(G.t * 4) * 1); }
      } else if (!sh.landed) { // dropped: it falls to the floor beside whoever speaks
        var kn = Math.min(1, sh.t / 0.8);
        sh.x = sh.fx + (sh.gx - sh.fx) * kn; sh.y = sh.fy + (GY - sh.fy) * kn - Math.sin(kn * Math.PI) * 46;
        if (kn >= 1) { sh.landed = true; sh.x = sh.gx; sh.y = GY; snd.play('bonk'); dust(sh.x, GY, 6); }
      }
    }
    if (B.phase === 'show') { B.wait -= dt; if (B.wait <= 0) bossWords(B); }
    if (B.phase === 'round' || B.phase === 'show') {   // whoever speaks points at it
      var rr0 = B.rounds[B.i];
      G.npcs.forEach(function (n) { if (n.cast) n.pointing = !!(sh && rr0 && (n.who === rr0.who || (rr0.who === 'twins' && (n.who === 'bo' || n.who === 'bea')))); });
    }
    if (B.phase === 'next') {
      B.wait -= dt;
      if (B.replyIn > 0) { B.replyIn -= dt; if (B.replyIn <= 0) { var rr = B.rounds[B.i]; bubble(gb, rr.reply, 2.2); say('grabbo', rr.reply); } }
      if (B.wait <= 0) bossRound(B);
    }
    // the words: fly out of the Pocket to a spot, then float there
    B.bubbles.forEach(function (bb) {
      if (bb.fly > 0) {
        bb.fly = Math.max(0, bb.fly - dt * 1.4);
        var k = 1 - bb.fly, e = k * (2 - k);
        bb.x = bb.fx + (bb.tx - bb.fx) * e; bb.y = bb.fy + (bb.ty - bb.fy) * e - Math.sin(k * Math.PI) * 30;
      } else if (bb.state === 'idle') { bb.x = bb.tx; bb.y = bb.ty + Math.sin(G.t * 2 + bb.phase) * 3; }
      if (bb.state === 'pop' && bb.respawn > 0) {
        bb.respawn -= dt;
        if (bb.respawn <= 0 && B.phase === 'round') {   // a wrong word comes back, from the Pocket, somewhere else
          var nb = newBubble(B, bb.word, 1, gb.x, gb.y + 10); nb.glow = false;
          for (var key in nb) bb[key] = nb[key];
          snd.play('pop');
        }
      }
    });
    // the thrown word flies to Grabbo
    B.shots = B.shots.filter(function (s) {
      s.t += dt * 1.9;
      var k = Math.min(1, s.t);
      s.x = s.sx + (gb.x - s.sx) * k; s.y = s.sy + (gb.y - s.sy) * k - Math.sin(k * Math.PI) * 40;
      if (s.t >= 1) { bossHit(B); return false; }
      return true;
    });
    // ink drops: dodge them
    if (B.phase === 'round' && !calm) {
      B.dropT -= dt;
      if (B.dropT <= 0) { B.dropT = 2.4 + Math.random() * 1.4; B.drops.push({ x: gb.x + (Math.random() - 0.5) * 20, y: gb.y + 16, vy: 0 }); snd.play('pop'); }
    }
    B.drops = B.drops.filter(function (d) {
      d.vy += 420 * dt; d.y += d.vy * dt;
      if (h.hurt <= 0 && Math.abs(d.x - (h.x + h.w / 2)) < 9 && d.y > h.y && d.y < h.y + h.h) {
        h.hurt = 1.0; h.vx = (h.x + h.w / 2 < d.x ? -1 : 1) * 150; h.vy = -170; snd.play('hurt'); burst(d.x, d.y, '#a983ea', 8); return false;
      }
      if (d.y >= GY) { burst(d.x, GY - 2, '#a983ea', 6); return false; }
      return true;
    });
  }

  /* ================================================================ the finale

  function finale() {

        start: function () { snd.play('fall'); G.boss.shots = []; } },

      { run: function (dt, s) {   // Pip flies over with a crayon
          if (!s.init) { s.init = true; p.pin = { x: p.x, y: p.y }; G.flyers.push({ item: 'crayon', many: false, x: p.x, y: p.y, tx: function () { return gb.x - 10; }, ty: function () { return gb.y + 4; }, t: -0.2 }); }
          toward(p.pin, gb.x - 22, gb.y - 6, Math.min(1, dt * 3)); s.k = (s.k || 0) + dt; return s.k > 1.0;
        } },
      lineStep('pip', 'This is your crayon, Grabbo.', { expr: 'happy' }),
      lineStep('grabbo', 'My... crayon?', { expr: 'neutral' }),
      lineStep('grabbo', 'Thank you!', { expr: 'happy', emote: '♥' }),
      lineStep('batuhan', 'Grabbo, this is our school.', { expr: 'happy' }),
      lineStep('batuhan', 'And you are our friend.', { expr: 'happy', emote: '♥' }),

      { run: function (dt, s) {   // the Pocket opens: everything comes back

            G.npcs.forEach(function (n) { if (n.cast) { n.cheer = 2.4; n.expr = 'happy'; } });
          }

        }, end: function () { G.portal = null; } },

      lineStep('max', 'Come and play, Grabbo!', { expr: 'happy' }),
      lineStep('hero', 'I am new here, too. We are all friends now!', { expr: 'happy', pose: 'cheer' }),
      // ...and then the dark comes back
      { run: function (dt, s) { s.k = (s.k || 0) + dt; return s.k > 0.8; },
        start: function () { snd.hush(true); G.portal = pocketPortal(gb, 12, true); gb.expr = 'neutral'; emote(gb, '!', 2); } },
      { whisper: { text: '...Grabbo... more... words...', dur: 3.2 } },
      lineStep('pip', 'What is that?!', { expr: 'surprised' }),
      { run: function (dt, s) {   // a shadow hand comes out of the Pocket and takes Pip
          s.k = (s.k || 0) + dt;
          var pt = G.portal, out = Math.min(1, s.k / 0.7), back = Math.max(0, (s.k - 1.0) / 0.8);

          G.hand = { x0: pt.x, y0: pt.y, x1: p.pin.x, y1: p.pin.y, k: out * (1 - back) };
          if (s.k > 0.7 && !s.got) { s.got = true; snd.play('hurt'); emote(h, '!', 2); G.npcs.forEach(function (n) { if (n.cast) { n.expr = 'surprised'; emote(n, '!', 2); } }); }
          if (s.got) { p.pin.x = pt.x + (p.pin.x - pt.x) * (1 - Math.min(1, back * 1.1)); p.pin.y = pt.y + (p.pin.y - pt.y) * (1 - Math.min(1, back * 1.1)); G.hand.x1 = p.pin.x; G.hand.y1 = p.pin.y; G.hand.k = 1; }
          if (back >= 1) { p.hidden = true; G.hand = null; burst(pt.x, pt.y, '#4a2a86', 14); return true; }
          return false;
        } },
      lineStep('hero', 'PIP!', { expr: 'surprised' }),
      { choose: { who: 'batuhan', q: 'Where is Pip?', options: ['He is in the Pocket!', 'He is in the gym.', 'He is at home.'], answer: 0, retry: 'Look! Where is Pip?' } },
      lineStep('grabbo', 'That is Hush! I am sorry...', { expr: 'sad' }),
      lineStep('grabbo', 'Hush is my... boss.', { expr: 'sad' }),

          if (s.k >= 1) { h.hidden = true; burst(pt.x, pt.y, '#c9a7f5', 16); snd.play('whoosh'); return true; }

        } },
      { run: function (dt, s) { s.k = (s.k || 0) + dt; G.portal.want = 0; return s.k > 1.0; }, end: function () { G.portal = null; } },

  function zoneIntro() {
    var z = zoneOf(G.zone);
    G.zoneTitle = { text: 'Zone ' + (G.zone + 1) + ':  ' + z.name, t: 3.2 };
    startScript((INTROS[z.id] || function () { return []; })());
  }
  function zoneEnd() {
    var z = zoneOf(G.zone);
    G.hero.vx = 0; G.outro = true;
    startScript((OUTROS[z.id] || function () { return []; })(), function () { G.outro = false; showReport(); });
  }
  function showReport() {
    var zs = G.score.zones[G.zone], ratio = zs.total ? zs.right / zs.total : 0;
    G.report = { zone: G.zone, right: zs.right, total: zs.total, stars: ratio >= 0.85 ? 3 : ratio >= 0.55 ? 2 : 1, t: 0 };
    G.mode = 'report'; snd.play('win'); snd.hush(false);
    var last = G.zone >= G.lvl.zones.length - 1;
    save(last ? null : G.zone + 1);
    say('batuhan', G.report.stars === 3 ? 'Excellent!' : G.report.stars === 2 ? 'Good job!' : 'Good try!');
  }
  function nextZone() {
    if (G.zone >= G.lvl.zones.length - 1) { G.mode = 'play'; showResults(); return; }
    fadeThen(function () { G.mode = 'play'; enterZone(G.zone + 1); zoneIntro(); });
  }
  /* put everything in place for zone k: earlier zones count as finished */
  function enterZone(k) {
    G.zone = k; G.report = null; G.outro = false; G.script = null; G.dialog = null; G.choice = null; G.grabbo = null;
    var z = zoneOf(k), h = G.hero;
    G.stations.forEach(function (st) { if (st.zone < k) { st.state = 'done'; st.gateOpen = 1; st.opening = false; } });
    G.stars.forEach(function (s) { if (s.x < z.x0) s.got = true; });
    G.goos.forEach(function (o) { if (o.x0 < z.x0) o.alive = false; });
    G.bonuses.forEach(function (bn) { if (bn.x < z.x0) { bn.got = true; bn.shown = true; } });
    G.hero.on = null; G.hero.boost = 0;
    G.active = null; G.pip.perch = null; G.bubbles = []; G.emotes = []; G.parts = []; G.flyers = []; G.tip = null;
    G.loose = []; G.rain = []; G.notesFx = []; G.portal = null; G.hand = null; G.boss = null; G.picture = null; G.card = null;
    h.hidden = false; h.frozen = false; G.pip.hidden = false; G.pip.pin = null; snd.hush(false);
    h.x = z.startX; h.y = GY - h.h; h.vx = h.vy = 0; h.carry = null; h.face = 1; h.safe = { x: h.x, y: h.y }; h.expr = null;
    G.pip.x = h.x - 18; G.pip.y = GY - 40;
    G.cam.x = Math.max(z.x0, Math.min(z.x1 - VW, h.x + h.w / 2 - VW * 0.4));
  }
  function fadeThen(midFn) { G.fade = { t: 0, mid: midFn, done: false }; }
  function updateFade(dt) {
    var f = G.fade; if (!f) return;
    f.t += dt;
    if (!f.done && f.t >= 0.45) { f.done = true; f.mid(); }
    if (f.t >= 0.9) G.fade = null;
  }

  /* ---- save: which zone to continue from, and the score so far */
  var SAVE_KEY = 'pq.unit2.save';
  function save(zone) {
    try {
      if (zone === null) { localStorage.removeItem(SAVE_KEY); return; }
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, hero: G.heroId, look: G.heroId === 'me' ? G.look : null, name: heroName(), zone: zone,
        stars: G.score.stars, zones: G.score.zones, right: G.score.right, total: G.score.total }));
    } catch (e) {}
  }
  function loadSave() {
    try {
      var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (d && d.v === 1 && d.zone > 0 && d.zone < L.unit2().zones.length) return d;
    } catch (e) {}
    return null;
  }

  /* ---- the script runner */
  function startScript(steps, after) { G.script = { steps: steps, i: -1, s: {}, after: after }; nextStep(); }
  function nextStep() {
    var sc = G.script; if (!sc) return;
    sc.i++; sc.s = {};
    G.dialog = null; G.choice = null; G.point = null;
    var st = sc.steps[sc.i];
    if (!st) { G.script = null; G.picture = null; if (sc.after) sc.after(); return; }
    if (st.pic !== undefined) G.picture = st.pic ? { kind: st.pic, t: 0 } : null;
    if (st.line) {
      G.dialog = { who: st.line[0], text: st.line[1], t: 0, expr: st.expr || 'neutral' };
      say(st.line[0], st.line[1]);
      if (st.line[0] === 'grabbo') snd.play('grabbo');
      G.npcs.forEach(function (n) { if (n.intro) n.pose = null; });   // a pose lasts one line
      castEach(st.line[0], function (n) { n.expr = st.expr || null; if (st.pose) n.pose = st.pose; if (st.emote) emote(n, st.emote); });
      if (st.point) G.point = { from: castFind(st.line[0]), to: pointOf(st.point) };
    } else if (st.choose) {
      openChoice(st.choose, false);
    } else if (st.cutin) {
      G.cutin = { text: st.cutin.text, dur: st.cutin.dur || 2, t: 0, expr: st.cutin.expr };
      snd.play('grabbo');
    } else if (st.card) {
      G.card = { text: st.card.text, sub: st.card.sub, dur: st.card.dur || 4, t: 0 };
      snd.play('win');
    } else if (st.whisper) {
      G.whisper = { text: st.whisper.text, dur: st.whisper.dur || 3, t: 0 };
      snd.play('gate');
      G.npcs.forEach(function (n) { if (n.intro) { n.expr = 'surprised'; emote(n, '!', 2); } });
    } else if (st.start) st.start();
  }
  function openChoice(c, retry) {
    var q = retry ? c.retry : c.q;
    G.dialog = { who: c.who, text: q, t: 0, expr: retry ? 'surprised' : 'neutral', ask: true };
    say(c.who, q);
    castEach(c.who, function (n) { n.expr = retry ? 'surprised' : null; n.pose = null; if (retry) emote(n, '?'); });
    G.choice = G.choice && G.choice.def === c ? G.choice : { def: c, sel: 0, mistakes: 0, reply: null };
    if (c.point) G.point = { from: castFind(c.who), to: pointOf(c.point) };
  }
  function pickChoice(i) {
    var ch = G.choice; if (!ch || ch.reply) return;
    var c = ch.def;
    if (c.free) {   // a story question: any answer is fine, and gets its own reply
      ch.reply = c.options[i];
      snd.play('pick');
      G.dialog = { who: 'hero', text: ch.reply, t: 0, expr: 'happy' };
      say('hero', ch.reply);
      var rep = c.replies && c.replies[i];
      if (rep) {
        if (typeof rep[0] === 'string') rep = [rep];
        var sc = G.script;
        rep.slice().reverse().forEach(function (r) { sc.steps.splice(sc.i + 1, 0, lineStep(r[0], r[1], { expr: r[2] || 'happy' })); });
      }
      return;
    }
    if (i === c.answer) {
      var first = ch.mistakes === 0;
      count(G.zone, 'ask', first, c.q + ' ' + c.options[c.answer]);
      snd.play('right');
      ch.reply = c.options[c.answer];
      G.dialog = { who: 'hero', text: ch.reply, t: 0, expr: 'happy' };
      say('hero', ch.reply);
      G.hero.expr = 'happy';
      castEach(c.who, function (n) { n.expr = 'happy'; });
    } else {
      ch.mistakes++;
      snd.play('wrong'); G.flash = 0.2;
      openChoice(c, true);
    }
  }
  function updateScript(dt) {
    var sc = G.script, st = sc.steps[sc.i];
    var go = pressed.ok || pressed.tap || pressed.act || (pressed.jump && !G.choice);
    if (G.dialog) {
      G.dialog.t += dt;
      typeBlips(G.dialog, Math.floor(G.dialog.t * 40), voiceOf(G.dialog.who));
      var full = G.dialog.t * 40 >= G.dialog.text.length;
      if (st.choose && G.choice && !G.choice.reply) {
        if (!full) { if (go && G.dialog.t > 0.15) G.dialog.t = 99; return; }
        var n = st.choose.options.length;
        if (pressed.up || pressed.left) { G.choice.sel = (G.choice.sel + n - 1) % n; snd.play('blip'); }
        if (pressed.down || pressed.right) { G.choice.sel = (G.choice.sel + 1) % n; snd.play('blip'); }
        if ((pressed.ok || pressed.act) && G.dialog.t > 0.3) pickChoice(G.choice.sel);
        return;
      }
      if (go && G.dialog.t > 0.2) {
        if (!full) G.dialog.t = 99;
        else nextStep();
      }
      return;
    }
    if (st.whisper && G.whisper) {
      G.whisper.t += dt;
      typeBlips(G.whisper, Math.floor(G.whisper.t * 14), 'hush');
      if (G.whisper.t >= G.whisper.dur || (go && G.whisper.t > 0.8)) { G.whisper = null; nextStep(); }
      return;
    }
    if (st.cutin && G.cutin) {
      G.cutin.t += dt;
      if (G.cutin.t >= G.cutin.dur || (go && G.cutin.t > 0.6)) { G.cutin = null; nextStep(); }
      return;
    }
    if (st.card && G.card) {
      G.card.t += dt;
      if (G.card.t >= G.card.dur || (go && G.card.t > 1.2)) { G.card = null; nextStep(); }
      return;
    }
    if (st.run && st.run(dt, sc.s)) { if (st.end) st.end(); nextStep(); }
  }

  /* ================================================================ modes */
  function startGame(heroId, fromSave) {
    G.endless = null; G.board = null;
    G.heroId = heroId; startLevel(); G.mode = 'play';
    if (fromSave) {
      G.score.stars = fromSave.stars || 0; G.score.right = fromSave.right || 0; G.score.total = fromSave.total || 0;
      (fromSave.zones || []).forEach(function (z, i) { if (G.score.zones[i]) G.score.zones[i] = { right: z.right, total: z.total }; });
      enterZone(fromSave.zone);
    } else enterZone(0);
    zoneIntro();
  }
  function showResults() {
    var sc = G.score, ratio = sc.total ? sc.right / sc.total : 0;
    var stars = ratio >= 0.85 ? 3 : ratio >= 0.55 ? 2 : 1;
    G.results = { stars: stars, t: 0 };
    save(null);
    G.mode = 'results';
    snd.play('win'); snd.hush(false);
    try {
      var best = JSON.parse(localStorage.getItem('pq.best') || '{}');
      if (!best.l1 || stars > best.l1) { best.l1 = stars; localStorage.setItem('pq.best', JSON.stringify(best)); }
    } catch (e) {}
    say('batuhan', stars === 3 ? 'Excellent! Three stars!' : stars === 2 ? 'Good job! Two stars!' : 'Good try! Play again!');
  }

  /* ================================================================ update */
  var RUN = 110, GRAV = 1000, JUMP = -380;
  var RUN_STEP = 5;   // px travelled per run frame: the planted foot moves 5px back per frame, so it stays put
  function updatePlay(dt) {
    G.t += dt;
    if (G.endless && G.endless.over) {   // the run is over: the right answer shows, then the class table
      var ov = G.endless.over; ov.t += dt;
      if (ov.t > 3.4 || ((pressed.ok || pressed.act || pressed.jump) && ov.t > 1.2)) showBoard();
      return;
    }
    if (G.reading) {   // reading is a pause: the book stays until it is closed
      G.reading.t += dt;
      if ((pressed.ok || pressed.act) && G.reading.t > 0.5) closeBook();
      return;
    }
    if (G.photo) { G.photo.t += dt; if (G.photo.t > 4.2) G.photo = null; }
    var h = G.hero, inScript = !!G.script;
    if (inScript) updateScript(dt);
    // the scene just ended in the report card: stop here, or the door would start the outro again
    if (G.mode !== 'play') return;
    G.bars += ((inScript && !G.outro ? 1 : inScript ? 1 : 0) - G.bars) * Math.min(1, dt * 6);
    // ---- hero control
    var dir = 0;
    if (!inScript) { if (held('left')) dir -= 1; if (held('right')) dir += 1; }
    var acc = h.onGround ? 1200 : 760;
    if (dir) { h.vx += dir * acc * dt; h.face = dir; }
    else { var f = (h.onGround ? 1400 : 320) * dt; h.vx = Math.abs(h.vx) <= f ? 0 : h.vx - Math.sign(h.vx) * f; }
    h.vx = Math.max(-RUN, Math.min(RUN, h.vx));
    h.coyote = h.onGround ? 0.1 : h.coyote - dt;
    h.jumpBuf = (!inScript && pressed.jump) ? 0.13 : h.jumpBuf - dt;
    if (h.jumpBuf > 0 && h.coyote > 0) { h.vy = JUMP; h.coyote = 0; h.jumpBuf = 0; snd.play('jump'); }
    if (h.boost > 0) h.boost -= dt;   // a trampoline's throw is not cut short when jump is let go
    else if (!held('jump') && h.vy < -170) h.vy = -170;
    h.vy = Math.min(h.vy + GRAV * dt, 460);
    // the things that move go along their paths; a plank or a belt carries whoever stands on it
    moveThings(dt);
    if (h.on && h.onGround && !h.frozen) {
      if (h.on.mx !== undefined) { h.x += h.on.mx; if (h.vy >= 0) h.y += h.on.my; }
      else if (h.on.dir) h.x += h.on.dir * BELT_V * dt;
    }
    var wasGround = h.onGround, fallSpeed = h.vy;
    if (h.frozen) { h.vx = h.vy = 0; } else moveHero(h, dt);
    var spring = !inScript && springAt(h);
    if (spring) {   // a trampoline: up you go
      spring.squash = 1; h.y = Math.min(h.y, spring.y - 12 - h.h); h.vy = SPRING_V; h.onGround = false; h.on = null; h.boost = 0.7; h.coyote = 0;
      snd.play('boing'); dust(spring.x, spring.y - 12, 6);
    } else if (h.on && h.on.state === 'idle') { h.on.state = 'shake'; h.on.t = 0; snd.play('crack'); }   // books start to give way   // frozen: a scene moves the hero itself
    if (!wasGround && h.onGround) { if (fallSpeed > 160) dust(h.x + h.w / 2, h.y + h.h, 6); h.land = 0.1; }
    if (h.land > 0) h.land -= dt;
    if (h.cheer > 0) h.cheer -= dt;
    if (h.onGround && Math.abs(h.vx) > 5) {
      h.dist += Math.abs(h.vx) * dt;
      var stepNow = Math.floor(h.dist / RUN_STEP) % 8;
      if (stepNow !== h.step && (stepNow === 0 || stepNow === 4) && Math.abs(h.vx) > 60) dust(h.x + h.w / 2 - h.face * 5, h.y + h.h, 1, -h.face);
      h.step = stepNow;
    } else if (h.onGround) { h.dist = 0; h.step = -1; }
    if (h.hurt > 0) h.hurt -= dt;
    if (h.onGround && !h.on && !nearInk(h.x, h.x + h.w)) {   // the last safe place: firm ground, not by the ink
      var under = function (px) { var t = tileAt(Math.floor(px / TS), Math.floor((h.y + h.h + 1) / TS)); return t === T.GROUND || t === T.BRICK; };
      if (under(h.x - 6) && under(h.x + h.w + 6)) h.safe = { x: h.x, y: h.y };
    }
    var inked = !inScript && !h.frozen && inInk(h);   // Hush's ink is like a pit
    if (h.y > VH + 40 || inked) {
      snd.play('fall'); if (inked) burst(h.x + h.w / 2, GY - 4, '#8a5ad8', 12);
      h.x = h.safe.x; h.y = h.safe.y - 2; h.vx = h.vy = 0; h.hurt = 1; h.on = null;
    }
    // ---- camera
    var zn = zoneOf(G.zone);
    var target = h.x + h.w / 2 - VW * 0.4;
    // an open station keeps its start (Pip, the near things) in view until the hero walks on
    if (G.active && G.active.state !== 'done') target = Math.max(G.active.x0, target);
    if (G.outro) target = zn.doorX - VW / 2;
    target = Math.max(zn.x0, Math.min(zn.x1 - VW, target));
    G.cam.x += (target - G.cam.x) * Math.min(1, dt * 5);
    // ---- pip
    var p = G.pip, tx, ty;
    if (p.pin) { p.x = p.pin.x; p.y = p.pin.y; tx = p.x; ty = p.y; }   // a scene holds Pip somewhere
    else if (p.perch) { tx = p.perch.x; ty = p.perch.y; }
    else { tx = h.x + h.w / 2 - h.face * 20; ty = h.y + 6 + Math.sin(G.t * 4) * 3; }
    p.x += (tx - p.x) * Math.min(1, dt * 6); p.y += (ty - p.y) * Math.min(1, dt * 6);
    p.resting = !!(p.perch && Math.abs(tx - p.x) < 2 && Math.abs(ty - p.y) < 2);
    p.face = p.perch ? 1 : h.face;
    // ---- stars
    G.stars.forEach(function (s) {
      if (s.got) return;
      if (Math.abs(s.x - (h.x + h.w / 2)) < 11 && Math.abs(s.y - (h.y + h.h / 2)) < h.h / 2 + 4) {
        s.got = true; G.score.stars++; snd.play('star'); burst(s.x, s.y, '#ffd23f', 6);
      }
    });
    // ---- the bonus stars: out when every star of the run is taken, worth five
    G.bonuses.forEach(function (bn) {
      if (bn.got) return;
      if (!bn.shown) {
        if (!bn.stars.every(function (s) { return s.got; })) return;
        bn.shown = true; bn.t = 0; snd.play('bonus'); burst(bn.x, bn.y, '#fff1a6', 16);
      }
      bn.t += dt;
      if (bn.t > 0.5 && Math.abs(bn.x - (h.x + h.w / 2)) < 14 && Math.abs(bn.y - (h.y + h.h / 2)) < h.h / 2 + 8) {
        bn.got = true; G.score.stars += BONUS; snd.play('right'); burst(bn.x, bn.y, '#ffd23f', 24);
        G.pops.push({ x: bn.x, y: bn.y - 8, t: 1.4, text: '+' + BONUS });
      }
    });
    G.pops = G.pops.filter(function (q) { q.t -= dt; q.y -= 18 * dt; return q.t > 0; });
    // ---- Hush's ink blobs
    G.goos.forEach(function (o) {
      if (!o.alive) { o.squash -= dt; return; }
      o.x += o.dir * (o.kind === 'fly' ? 30 : 22) * dt;
      if (o.x < o.x0 - o.range) o.dir = 1; if (o.x > o.x0 + o.range) o.dir = -1;
      if (o.kind === 'hop') {   // it jumps now and then
        o.hopT -= dt;
        if (o.air <= 0 && o.hopT <= 0) { o.vy = -250; o.hopT = 1.4 + (o.i % 3) * 0.35; }
        if (o.vy || o.air > 0) { o.vy += 900 * dt; o.air = Math.max(0, o.air - o.vy * dt); if (o.air === 0 && o.vy > 0) o.vy = 0; }
        o.feet = GY - o.air;
      } else if (o.kind === 'fly') o.feet = o.fy + Math.sin(G.t * 2.4 + o.i) * 10;   // it flies in a wave
      else o.feet = GY;
      var ob = { x: o.x - 8, y: o.feet - 11, w: 16, h: 11 };
      if (!overlap(h, ob)) return;
      if (h.vy > 0 && h.y + h.h - h.vy * dt <= ob.y + 4) {
        o.alive = false; o.squash = 0.45; h.vy = -280; snd.play('stomp'); burst(o.x, o.feet - 6, '#a983ea', 10);
      } else if (h.hurt <= 0) {
        h.hurt = 1.2; h.vx = (h.x + h.w / 2 < o.x ? -1 : 1) * 160; h.vy = -200; snd.play('hurt');
      }
    });
    // ---- stations, interact
    G.stations.forEach(function (st) { updateStation(st, dt); });
    // a spot on the path that starts a little scene (a clue, the piano, Grabbo's table)
    if (!G.script && !G.fade && !G.reading) G.lvl.decor.forEach(function (d) {
      if (!d.beat || d.seen || !BEATS[d.beat] || G.script) return;
      if (Math.abs(h.x + h.w / 2 - (d.x + 8)) < 12 && h.x >= zn.x0 && h.x <= zn.x1) { d.seen = true; h.vx = 0; startScript(BEATS[d.beat](d)); }
    });
    if (G.boss && !G.script) updateBoss(dt);
    // the music room is silent until the right words bring the music back
    snd.hush(zn.theme2 === 'music' && h.x + h.w / 2 >= zn.split && !G.musicBack);
    G.target = inScript ? null : findTarget();
    if (pressed.act && !inScript && G.target) interact(G.target);
    // ---- npcs
    G.npcs.forEach(function (n) {
      if (n.cool > 0) n.cool -= dt; if (n.cheer > 0) n.cheer -= dt;
      n.hop = n.cheer > 0 ? Math.abs(Math.sin(n.cheer * 9)) * 4 : 0;
    });
    // ---- things flying into Grabbo's pocket
    G.flyers = G.flyers.filter(function (fl) {
      fl.t += dt * 1.8;
      if (fl.t >= 1) { burst(fl.tx(), fl.ty(), fl.land ? '#ffffff' : '#c9a7f5', 6); if (fl.land) fl.land(); return false; }
      return true;
    });
    // ---- things raining back out of the Pocket, notes in the music room, the Pocket opening
    G.rain = G.rain.filter(function (r) { r.vy += 260 * dt; r.y += r.vy * dt; if (r.y >= GY) { burst(r.x, GY - 4, '#ffffff', 3); return false; } return true; });
    G.notesFx = G.notesFx.filter(function (q) { q.t -= dt; q.y += q.vy * dt; q.x += Math.sin(G.t * 5 + q.y * 0.1) * 0.4; return q.t > 0; });
    if (G.portal) {
      G.portal.r += ((G.portal.want || 0) - G.portal.r) * Math.min(1, dt * 4);
      if (G.portal.follow && G.grabbo) { var pk = pocketOf(G.grabbo); G.portal.x = pk.x; G.portal.y = pk.y; }
    }
    // ---- particles / bubbles / emotes / tip
    G.parts = G.parts.filter(function (q) { q.life -= dt; q.vy += (q.g === undefined ? 300 : q.g) * dt; q.x += q.vx * dt; q.y += q.vy * dt; return q.life > 0; });

    G.emotes = G.emotes.filter(function (e) { e.t -= dt; return e.t > 0; });
    if (G.tip) { G.tip.t -= dt; if (G.tip.t <= 0) G.tip = null; }
    if (G.flash > 0) G.flash -= dt;
    if (G.grabbo) G.grabbo.frame = Math.floor(G.t * 4) % 2;
    // ---- end of the zone: its door, with every gate in the zone open
    if (!zn.boss && !G.script && !G.fade && h.x + h.w / 2 > zn.doorX - 30 &&
        G.stations.every(function (s) { return s.zone !== G.zone || s.state === 'done'; })) {
      if (G.endless) { h.vx = 0; snd.play('gate'); fadeThen(function () { enterRoom(G.endless.room + 1); }); }   // on to the next room
      else zoneEnd();

  }

  /** the song for where we are (js/music.js): the title's on the title, the student card, the class
   * table and the results; each place its own (the music room's once the music is back: sound.js
   * keeps it silent till then); Grabbo's on the rooftop; the run's own, a little faster every room */
  function songNow() {
    if (G.mode === 'title' || G.mode === 'create' || G.mode === 'board' || G.mode === 'results') return 'title';
    if (G.endless) return 'endless';
    var z = G.lvl && zoneOf(G.zone), h = G.hero;
    if (!z) return 'title';
    if (z.boss) return 'boss';
    return z.split && h && h.x + h.w / 2 >= z.split ? z.theme2 : z.theme;
  }
  function update(dt) {
    snd.song(songNow(), G.endless && G.mode !== 'board' ? 1 + Math.min(0.2, G.endless.room * 0.025) : 1);
    if (G.mode === 'title') {
      var sv = loadSave(), items = titleItems(sv), n = items.length;
      if (G.titleSel >= n) G.titleSel = 0;
      if (pressed.left || pressed.up) { G.titleSel = (G.titleSel + n - 1) % n; snd.play('blip'); }
      if (pressed.right || pressed.down) { G.titleSel = (G.titleSel + 1) % n; snd.play('blip'); }
      if ((pressed.ok || pressed.act) && G.t > 0.2) titleGo(items[G.titleSel][2], sv);
      G.t += dt;
    } else if (G.mode === 'create') updateCreate(dt);
    else if (G.mode === 'play') updatePlay(dt);
    else if (G.mode === 'report' && G.report) {
      G.report.t += dt; G.t += dt;
      if ((pressed.ok || pressed.jump || pressed.act) && G.report.t > 0.8 && !G.fade) nextZone();
    } else if (G.mode === 'results') {
      G.results.t += dt; G.t += dt;
      if ((pressed.ok || pressed.act) && G.results.t > 1) startGame(G.heroId);
    } else if (G.mode === 'board' && G.board) {
      G.board.t += dt; G.t += dt;
      var E2 = G.endless;   // no answer from the class table in eight seconds: this device's table, and the run kept to send again
      if (E2 && E2.table === 'wait') {
        E2.waitT += dt;
        if (E2.waitT > 8) { E2.table = 'offline'; keepPending(pendingRuns().concat([{ name: E2.name, score: E2.score }])); }
      }
      if (pressed.left || pressed.up) { if (G.board.sel) snd.play('blip'); G.board.sel = 0; }
      if (pressed.right || pressed.down) { if (!G.board.sel) snd.play('blip'); G.board.sel = 1; }
      if ((pressed.ok || pressed.act) && G.board.t > 1) boardGo(G.board.sel);
    }
    updateFade(dt);
    pressed = {};
  }

  /* ================================================================ render: characters */
  function heroPose(h) {
    var run = Math.floor(h.dist / RUN_STEP) % 8, moving = h.onGround && Math.abs(h.vx) > 5;
    var carry = !!h.carry;
    if (!h.onGround) return h.vy < 0 ? 'jump' : 'fall';
    if (h.land > 0 && !carry) return 'land';
    if (moving) return (carry ? 'carryRun' : 'run') + run;
    if (carry) return 'carry';
    if (h.cheer > 0) return 'cheer';
    return Math.floor(G.t * 1.6) % 2 ? 'breathe' : 'stand';
  }
  function blinking(phase) { return ((G.t + phase) % 3.4) < 0.13; }
  function charSprite(id, pose, expr, hold) {
    var o = hold ? { hold: { name: hold.item, many: !!hold.many } } : undefined;
    if (id === 'max' && capless()) { o = o || {}; o.style = 'spiky'; }   // his cap is lost
    return CH.get(id, pose, expr || 'neutral', 1, o);
  }
  function drawSprite(cvs, x, feetY, face) {
    var dx = Math.round(x - (face < 0 ? cvs.width - cvs.anchor.x : cvs.anchor.x)), dy = Math.round(feetY - cvs.anchor.y);
    if (face >= 0) { g.drawImage(cvs, dx, dy); return; }
    g.save(); g.translate(dx + cvs.width, dy); g.scale(-1, 1); g.drawImage(cvs, 0, 0); g.restore();
  }
  function talkingNow(who) {
    var d = G.dialog;
    return d && d.t * 40 < d.text.length && (d.who === who || (d.who === 'twins' && (who === 'bo' || who === 'bea')) || (d.who === 'hero' && who === 'hero'));
  }
  function npcLook(n) {
    var expr = n.expr || 'neutral';
    if (n.cheer > 0) expr = 'cheer';
    if (talkingNow(n.who) || G.bubbles.some(function (b) { return b.ent === n && b.t > 2.2; })) expr = Math.floor(G.t * 8) % 2 ? 'talk' : (expr === 'neutral' ? 'neutral' : expr);
    if (expr === 'neutral' && blinking(n.phase)) expr = 'blink';
    var pose = n.pose || 'stand';
    if (n.walking) pose = 'run' + (Math.floor((n.walkDist || 0) / RUN_STEP) % 8);
    else if (n.cheer > 0) pose = 'cheer';
    else if (n.hold) pose = 'carry';
    else if (n.pointing) pose = 'point';
    else if (pose === 'stand') pose = Math.floor((G.t + n.phase) * 1.6) % 2 ? 'breathe' : 'stand';
    else if (pose === 'wave') pose = Math.floor(G.t * 3) % 2 ? 'wave' : 'wave2';
    return charSprite(n.who, pose, expr, n.walking ? null : n.hold);
  }
  function headTop(n) {   // the top of someone's head, in world y
    var cvs = npcLook(n);
    return n.y - n.hop - cvs.anchor.y + cvs.headTop;
  }
  function itemTall(it) { return CH.item(it.name, it.many, 1, 1.3).anchor.y; }
  function drawNpc(n, cx) {
    if (n.hidden) return;
    var cvs = npcLook(n), x = n.x - cx;
    WD.shadow(g, x, GY + 1, CH.CAST[n.who] && CH.CAST[n.who].adult ? 20 : 17);
    if (n.glow) { g.globalAlpha = 0.35 + 0.3 * Math.sin(G.t * 8); g.fillStyle = '#ffffff'; g.fillRect(Math.round(x - 13), Math.round(n.y - 50), 26, 51); g.globalAlpha = 1; }
    drawSprite(cvs, x, n.y + 1 - n.hop, n.face);
  }
  function heroLook() {
    var h = G.hero, expr = h.expr || 'neutral';
    if (h.cheer > 0) expr = 'happy';
    if (talkingNow('hero')) expr = Math.floor(G.t * 8) % 2 ? 'talk' : expr;
    if (expr === 'neutral' && blinking(0.7)) expr = 'blink';
    var pose = heroPose(h);
    if (G.script) {
      var st = G.script.steps[G.script.i];
      if (st && st.line && st.line[0] === 'hero' && st.pose) pose = st.pose;
      if (h.walking) pose = 'run' + (Math.floor((h.walkDist || 0) / RUN_STEP) % 8);
    }
    return charSprite(G.heroId, pose, expr, h.carry);
  }

  /* ================================================================ render: world */
  function theme() { return zoneOf(G.zone).theme; }
  function drawWorld() {
    var cx = Math.round(G.cam.x), zn = zoneOf(G.zone), th = zn.theme;
    // the room behind; a zone that changes room halfway draws the second room past its archway
    SC.backdrop(g, th, cx, G.t);
    if (zn.split && zn.split - cx < VW) {
      var sx = Math.max(0, Math.round(zn.split - cx));
      g.save(); g.beginPath(); g.rect(sx, 0, VW - sx, VH); g.clip();
      SC.backdrop(g, zn.theme2, cx, G.t);
      if (zn.theme2 === 'music') {
        var back = G.musicBack ? 4 : G.stations.filter(function (s) { return s.zone === G.zone && s.x0 >= zn.split && (s.state === 'solved' || s.state === 'done'); }).length;
        SC.musicNotes(g, cx, back, G.t);
      }
      g.restore();
    }
    G.lvl.decor.forEach(function (d) { SC.prop(g, d, cx, th); });
    G.stations.forEach(function (st) {
      if (st.x0 - cx > VW + 20 || st.x0 + STW - cx < -20) return;
      if (perches(st)) { WD.pad(g, st.x0 + PERCH.dx - cx, GY); WD.signpost(g, st.x0 + PERCH.dx - cx, GY, '!'); }
      if (st.type === 'read') SC.lectern(g, st.book.x - cx, GY, (st.bookGlow || !st.opened) && st.state === 'active', G.t);
      if (st.poster) SC.poster(g, st.poster.x - cx, GY, st.poster.text);
    });
    SC.terrain(g, G.lvl, T, cx, zn);
    drawThings(cx);
    // a clue nobody has looked at yet sparkles
    G.lvl.decor.forEach(function (d) {
      if (d.kind !== 'clue' || d.seen || Math.abs(d.x - cx - VW / 2) > VW) return;
      if (Math.floor(G.t * 3) % 2) { var sx2 = Math.round(d.x - cx + 18), sy2 = GY - 56; U.rect(g, '#ffffff', sx2, sy2 - 2, 1, 5); U.rect(g, '#ffffff', sx2 - 2, sy2, 5, 1); }
    });
    // station things
    G.stations.forEach(function (st) {
