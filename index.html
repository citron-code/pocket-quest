<script>/* js/gfx/px.js */
/* Pocket Quest - pixel raster kit (rework).
 *
 * Characters and props are built from simple shapes (ellipses, capsules,
 * rounded boxes, polygons) rasterized straight onto the pixel grid and shaded
 * with 4-tone hue-shifted ramps from one light: the top-front, which is the
 * top right for a sprite facing right. Then:
 *   - where a front part overlaps a back part, the back part gets a dark
 *     contour, so arms and legs separate from the body;
 *   - the silhouette gets an outline: dark ink on the shadow side, a coloured
 *     line on the lit side ("sel-out").
 * Hand-made decals (eyes, mouths, logos) go on top. The same model can be
 * rasterized at 1x (sprite) or 2x (portrait), so a face matches in both.
 */
window.PQ = window.PQ || {};
PQ.px = (function () {
  'use strict';
  var INK = '#1b1029';
  var L = norm(0.5, -0.72, 0.68);         // towards the light: right, up, out of the screen
  var TH = [0.74, 0.3, -0.18];           // intensity thresholds for tones 0..3

  function norm(x, y, z) { var l = Math.hypot(x, y, z) || 1; return [x / l, y / l, z / l]; }
  function rgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
  function hex(c) { return '#' + c.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join(''); }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return hex([x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t]); }

  /** a material: four tones from lit to deep, and the colour of its lit outline */
  function ramp(hi, base, shade, deep, line) { return { c: [hi, base, shade, deep], line: line || mix(deep, INK, 0.55) }; }

  function toneOf(i, o) {
    i += (o && o.bias) || 0;
    var t = (o && o.th) || TH;
    var tone = i > t[0] ? 0 : i > t[1] ? 1 : i > t[2] ? 2 : 3;
    if (o && o.min !== undefined) tone = Math.max(o.min, tone);
    if (o && o.max !== undefined) tone = Math.min(o.max, tone);
    return tone;
  }

  function Pic(w, h) {
    this.w = w; this.h = h;
    var n = w * h;
    this.col = new Array(n).fill(null);
    this.pid = new Int16Array(n).fill(-1);
    this.rmp = new Array(n).fill(null);
    this.tone = new Int8Array(n).fill(-1);
    this.parts = []; this.cur = -1; this.mask = null;
  }
  /** start a new part: later parts are in front of earlier ones */
  Pic.prototype.part = function (name, o) {
    this.cur = this.parts.length;
    this.parts.push({ name: name, contour: !(o && o.contour === false), soft: !!(o && o.soft) });
    this.mask = null;
    return this;
  };
  Pic.prototype.idOf = function (name) {
    for (var i = this.parts.length - 1; i >= 0; i--) if (this.parts[i].name === name) return i;
    return -2;
  };
  /** draw only on pixels that already belong to the named parts */
  Pic.prototype.only = function (names) {
    var self = this, ids = [].concat(names).map(function (n) { return self.idOf(n); });
    this.mask = function (i) { return ids.indexOf(self.pid[i]) >= 0; };
    return this;
  };
  Pic.prototype.free = function () { this.mask = null; return this; };
  Pic.prototype.set = function (x, y, r, tone, color, keepPart) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    var i = y * this.w + x;
    if (this.mask && !this.mask(i)) return;
    if (!keepPart) this.pid[i] = this.cur;
    this.rmp[i] = r; this.tone[i] = r ? tone : -1;
    this.col[i] = color || (r ? r.c[tone] : null);
  };
  Pic.prototype.get = function (x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? null : this.col[y * this.w + x]; };
  Pic.prototype.clear = function (x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    var i = y * this.w + x; this.col[i] = null; this.pid[i] = -1; this.rmp[i] = null; this.tone[i] = -1;
  };

  function shadeFrom(nx, ny, nz, o) {
    var n = norm(nx, ny, nz * ((o && o.flat) || 1));
    return toneOf(n[0] * L[0] + n[1] * L[1] + n[2] * L[2], o);
  }
  function clipOk(o, x, y) { return !o || !o.clip || o.clip(x, y); }

  /** a lit ellipse (a sphere seen from the front) */
  Pic.prototype.ellipse = function (cx, cy, rx, ry, r, o) {
    o = o || {};
    for (var y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry); y++) for (var x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx); x++) {
      var dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, d = dx * dx + dy * dy;
      if (d > 1 || !clipOk(o, x + 0.5, y + 0.5)) continue;
      var t = o.tone !== undefined ? o.tone : shadeFrom(dx, dy, Math.sqrt(1 - d), o);
      if (o.erase) this.clear(x, y); else this.set(x, y, r, t);
    }
    return this;
  };
  /** a lit capsule (a limb): a round tube from (x1,y1) to (x2,y2) */
  Pic.prototype.capsule = function (x1, y1, x2, y2, rad, r, o) {
    o = o || {};
    var vx = x2 - x1, vy = y2 - y1, ll = vx * vx + vy * vy || 1e-6;
    for (var y = Math.floor(Math.min(y1, y2) - rad) - 1; y <= Math.ceil(Math.max(y1, y2) + rad); y++)
      for (var x = Math.floor(Math.min(x1, x2) - rad) - 1; x <= Math.ceil(Math.max(x1, x2) + rad); x++) {
        var px = x + 0.5, py = y + 0.5;
        var t = Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / ll));
        var ox = px - (x1 + vx * t), oy = py - (y1 + vy * t), d = Math.hypot(ox, oy) / rad;
        if (d > 1 || !clipOk(o, px, py)) continue;
        var tone = o.tone !== undefined ? o.tone : shadeFrom(ox / rad, oy / rad, Math.sqrt(Math.max(0, 1 - d * d)), o);
        this.set(x, y, r, tone);
      }
    return this;
  };
  /** a rounded box shaded like an upright cylinder (a torso, a box) */
  Pic.prototype.rbox = function (x0, y0, x1, y1, rad, r, o) {
    o = o || {};
    var cx = (x0 + x1) / 2, hw = (x1 - x0) / 2, cy = (y0 + y1) / 2, hh = (y1 - y0) / 2;
    for (var y = Math.floor(y0); y < Math.ceil(y1); y++) for (var x = Math.floor(x0); x < Math.ceil(x1); x++) {
      var px = x + 0.5, py = y + 0.5;
      var qx = Math.max(Math.abs(px - cx) - (hw - rad), 0), qy = Math.max(Math.abs(py - cy) - (hh - rad), 0);
      if (qx * qx + qy * qy > rad * rad || !clipOk(o, px, py)) continue;
      var nx = (px - cx) / hw, ny = (py - cy) / hh * (o.vert || 0.35);
      var tone = o.tone !== undefined ? o.tone : shadeFrom(nx, ny, Math.sqrt(Math.max(0.05, 1 - nx * nx)), o);
      this.set(x, y, r, tone);
    }
    return this;
  };
  /** a polygon, shaded by where each pixel sits relative to its centre */
  Pic.prototype.poly = function (pts, r, o) {
    o = o || {};
    var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, cx = 0, cy = 0;
    pts.forEach(function (p) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); cx += p[0]; cy += p[1]; });
    cx /= pts.length; cy /= pts.length;
    var ex = Math.max(1, (maxx - minx) / 2), ey = Math.max(1, (maxy - miny) / 2);
    if (o.cx !== undefined) { cx = o.cx; cy = o.cy; }
    for (var y = Math.floor(miny); y <= Math.ceil(maxy); y++) for (var x = Math.floor(minx); x <= Math.ceil(maxx); x++) {
      var px = x + 0.5, py = y + 0.5, inside = false;
      for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        var a = pts[i], b = pts[j];
        if ((a[1] > py) !== (b[1] > py) && px < (b[0] - a[0]) * (py - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
      }
      if (!inside || !clipOk(o, px, py)) continue;
      var tone = o.tone !== undefined ? o.tone : shadeFrom((px - cx) / ex, (py - cy) / ey, 0.9, o);
      if (o.erase) this.clear(x, y); else this.set(x, y, r, tone);
    }
    return this;
  };
  /** move the tone of pixels already drawn (cast shadows, highlights) */
  Pic.prototype.retone = function (test, delta, names) {
    var ids = names ? [].concat(names).map(this.idOf.bind(this)) : null;
    for (var y = 0; y < this.h; y++) for (var x = 0; x < this.w; x++) {
      var i = y * this.w + x;
      if (!this.rmp[i] || (ids && ids.indexOf(this.pid[i]) < 0) || !test(x + 0.5, y + 0.5, x, y)) continue;
      var t = Math.max(0, Math.min(3, this.tone[i] + delta));
      this.tone[i] = t; this.col[i] = this.rmp[i].c[t];
    }
    return this;
  };
  /** pixels of part `onto` just below / beside part `from` get one tone darker */
  Pic.prototype.castShadow = function (from, onto, dx, dy, n) {
    var a = this.idOf(from), self = this;
    var test = function (px, py, x, y) {
      for (var s = 1; s <= (n || 1); s++) {
        var sx = x - dx * s, sy = y - dy * s;
        if (sx >= 0 && sy >= 0 && sx < self.w && sy < self.h && self.pid[sy * self.w + sx] === a) return true;
      }
      return false;
    };
    return this.retone(test, 1, onto);
  };
  /** hand-made pixels: a grid of letters, each mapped to a colour */
  Pic.prototype.decal = function (rows, x, y, pal, flip) {
    for (var j = 0; j < rows.length; j++) {
      var row = rows[j];
      for (var i = 0; i < row.length; i++) {
        var ch = row[flip ? row.length - 1 - i : i];
        if (ch === '.' || ch === ' ' || !pal[ch]) continue;
        if (pal[ch] === 'clear') { this.clear(x + i, y + j); continue; }
        this.set(x + i, y + j, null, -1, pal[ch], true);
      }
    }
    return this;
  };

  /** finish: contours between parts, then the sel-out outline. Returns a canvas. */
  Pic.prototype.toCanvas = function (o) {
    o = o || {};
    var w = this.w, h = this.h, col = this.col.slice(), self = this, x, y, i;
    if (o.contour !== false) {
      for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
        i = y * w + x;
        var a = this.pid[i];
        if (a < 0 || !this.parts[a].contour) continue;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
          var nx = x + d[0], ny = y + d[1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) return;
          var j = ny * w + nx, b = self.pid[j];
          if (b < 0 || b >= a || !self.rmp[j]) return;
          var r = self.rmp[j];
          col[j] = self.parts[a].soft ? r.c[Math.min(3, self.tone[j] + 1)] : (self.tone[j] >= 3 ? r.line : r.c[3]);
        });
      }
    }
    var pad = o.outline === false ? 0 : 1;
    var c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
    var g = c.getContext('2d');
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
      var cc = col[y * w + x]; if (!cc) continue;
      g.fillStyle = cc; g.fillRect(x + pad, y + pad, 1, 1);
    }
    if (pad) {
      var ink = o.ink || INK;
      for (y = -1; y <= h; y++) for (x = -1; x <= w; x++) {
        if (x >= 0 && y >= 0 && x < w && y < h && col[y * w + x]) continue;
        var below = y + 1 < h && x >= 0 && x < w && col[(y + 1) * w + x];
        var left = x - 1 >= 0 && y >= 0 && y < h && col[y * w + x - 1];
        var above = y - 1 >= 0 && x >= 0 && x < w && col[(y - 1) * w + x];
        var right = x + 1 < w && y >= 0 && y < h && col[y * w + x + 1];
        if (!(below || left || above || right)) continue;
        // lit side (top, right): the material's own dark line; shadow side: ink
        var src = below ? (y + 1) * w + x : left ? y * w + x - 1 : -1;
        var lit = o.selout !== false && src >= 0 && !above && !right && this.rmp[src];
        g.fillStyle = lit ? this.rmp[src].line : ink;
        g.fillRect(x + pad, y + pad, 1, 1);
      }
    }
    return c;
  };

  return { INK: INK, ramp: ramp, mix: mix, Pic: Pic, rgb: rgb, hex: hex, L: L };
})();

</script>
<script>/* js/gfx/font.js */
/* Pocket Quest - pixel font (rework).
 *
 * Our own bitmap font, drawn for 7-8 year olds: single-storey a and g (the
 * way children learn to write them), l with a tail so it never looks like I,
 * round open shapes. Cap height 9, x-height 6, descenders 3. The bold weight
 * (used for almost everything) is the same drawing one pixel thicker.
 * Text is rendered once into a small canvas (fill, outline, shadow) and
 * cached, then drawn like any sprite.
 */
window.PQ = window.PQ || {};
PQ.font = (function () {
  'use strict';
  var ROWS = 12;   // 0-8 above the baseline, 9-11 descenders
  var G = {};
  function g(ch, top, rows) { G[ch] = { top: top, rows: rows.split('|'), w: rows.split('|')[0].length }; }

  // capitals
  g('A', 0, '.####.|#....#|#....#|#....#|######|#....#|#....#|#....#|#....#');
  g('B', 0, '#####.|#....#|#....#|#....#|#####.|#....#|#....#|#....#|#####.');
  g('C', 0, '.####.|#....#|#.....|#.....|#.....|#.....|#.....|#....#|.####.');
  g('D', 0, '####..|#...#.|#....#|#....#|#....#|#....#|#....#|#...#.|####..');
  g('E', 0, '#####|#....|#....|#....|####.|#....|#....|#....|#####');
  g('F', 0, '#####|#....|#....|#....|####.|#....|#....|#....|#....');
  g('G', 0, '.####.|#....#|#.....|#.....|#..###|#....#|#....#|#....#|.####.');
  g('H', 0, '#....#|#....#|#....#|#....#|######|#....#|#....#|#....#|#....#');
  g('I', 0, '###|.#.|.#.|.#.|.#.|.#.|.#.|.#.|###');
  g('J', 0, '....#|....#|....#|....#|....#|....#|#...#|#...#|.###.');
  g('K', 0, '#....#|#...#.|#..#..|#.#...|##....|#.#...|#..#..|#...#.|#....#');
  g('L', 0, '#....|#....|#....|#....|#....|#....|#....|#....|#####');
  g('M', 0, '#.....#|##...##|#.#.#.#|#..#..#|#.....#|#.....#|#.....#|#.....#|#.....#');
  g('N', 0, '#....#|##...#|##...#|#.#..#|#.#..#|#..#.#|#..#.#|#...##|#....#');
  g('O', 0, '.####.|#....#|#....#|#....#|#....#|#....#|#....#|#....#|.####.');
  g('P', 0, '#####.|#....#|#....#|#....#|#####.|#.....|#.....|#.....|#.....');
  g('Q', 0, '.####.|#....#|#....#|#....#|#....#|#....#|#..#.#|#...#.|.###.#');
  g('R', 0, '#####.|#....#|#....#|#....#|#####.|#..#..|#...#.|#....#|#....#');
  g('S', 0, '.####.|#....#|#.....|#.....|.####.|.....#|.....#|#....#|.####.');
  g('T', 0, '#####|..#..|..#..|..#..|..#..|..#..|..#..|..#..|..#..');
  g('U', 0, '#....#|#....#|#....#|#....#|#....#|#....#|#....#|#....#|.####.');
  g('V', 0, '#...#|#...#|#...#|#...#|.#.#.|.#.#.|.#.#.|..#..|..#..');
  g('W', 0, '#.....#|#.....#|#.....#|#.....#|#..#..#|#..#..#|#.#.#.#|##...##|#.....#');
  g('X', 0, '#....#|#....#|.#..#.|.#..#.|..##..|.#..#.|.#..#.|#....#|#....#');
  g('Y', 0, '#...#|#...#|#...#|.#.#.|.#.#.|..#..|..#..|..#..|..#..');
  g('Z', 0, '######|.....#|....#.|....#.|...#..|..#...|.#....|#.....|######');
  // small letters (x-height 6, from row 3)
  g('a', 3, '.###.#|#...##|#....#|#....#|#...##|.###.#');
  g('b', 0, '#.....|#.....|#.....|#.###.|##...#|#....#|#....#|##...#|#.###.');
  g('c', 3, '.###.|#...#|#....|#....|#...#|.###.');
  g('d', 0, '.....#|.....#|.....#|.###.#|#...##|#....#|#....#|#...##|.###.#');
  g('e', 3, '.####.|#....#|######|#.....|#....#|.####.');
  g('f', 0, '..##|.#..|.#..|####|.#..|.#..|.#..|.#..|.#..');
  g('g', 3, '.###.#|#...##|#....#|#....#|#...##|.###.#|.....#|#....#|.####.');
  g('h', 0, '#.....|#.....|#.....|#.###.|##...#|#....#|#....#|#....#|#....#');

  g('p', 3, '#.###.|##...#|#....#|#....#|##...#|#.###.|#.....|#.....|#.....');
  g('q', 3, '.###.#|#...##|#....#|#....#|#...##|.###.#|.....#|.....#|.....#');
  g('r', 3, '#.###|##...|#....|#....|#....|#....');
  g('s', 3, '.####|#....|.###.|....#|....#|####.');
  g('t', 1, '.#..|.#..|####|.#..|.#..|.#..|.#..|..##');
  g('u', 3, '#....#|#....#|#....#|#....#|#...##|.###.#');
  g('v', 3, '#...#|#...#|#...#|.#.#.|.#.#.|..#..');
  g('w', 3, '#.....#|#.....#|#..#..#|#..#..#|#.#.#.#|.#...#.');
  g('x', 3, '#...#|.#.#.|..#..|..#..|.#.#.|#...#');
  g('y', 3, '#...#|#...#|#...#|#...#|#..##|.##.#|....#|#...#|.###.');
  g('z', 3, '#####|...#.|..#..|.#...|#....|#####');
  // Turkish letters, for the children's own names. Capitals keep their full
  // height and carry their marks above it (rows -3..-1, see headroom()).
  g('Ç', 0, '.####.|#....#|#.....|#.....|#.....|#.....|#.....|#....#|.####.|...#..|..##..');
  g('Ş', 0, '.####.|#....#|#.....|#.....|.####.|.....#|.....#|#....#|.####.|...#..|..##..');
  g('Ğ', -3, '#....#|.####.|......|.####.|#....#|#.....|#.....|#..###|#....#|#....#|#....#|.####.');
  g('İ', -2, '.#.|...|###|.#.|.#.|.#.|.#.|.#.|.#.|.#.|###');
  g('Ö', -2, '.#..#.|......|.####.|#....#|#....#|#....#|#....#|#....#|#....#|#....#|.####.');
  g('Ü', -2, '.#..#.|......|#....#|#....#|#....#|#....#|#....#|#....#|#....#|#....#|.####.');
  g('ç', 3, '.###.|#...#|#....|#....|#...#|.###.|..#..|.##..');
  g('ş', 3, '.####|#....|.###.|....#|....#|####.|..#..|.##..');
  g('ğ', 0, '#....#|.####.|......|.###.#|#...##|#....#|#....#|#...##|.###.#|.....#|#....#|.####.');
  g('ı', 3, '#|#|#|#|#|#');
  g('ö', 1, '.#..#.|......|.####.|#....#|#....#|#....#|#....#|.####.');

    surprised: ['wide', 'up', 'wide'], sad: ['sad', 'worried', 'sad'], worried: ['open', 'worried', 'flat'],

  /* ------------------------------------------------------------ the model */
  function build(id, poseName, expr, k, opts) {

    var pose = typeof poseName === 'object' ? poseName : POSES[poseName || 'stand'] || STAND;
    var A = !!d.adult;
    var legL = A ? 8.8 : 5.8, armL = A ? 6.6 : 4.9, sL = legL / 5.8, sA = armL / 4.9;
    var W = (A ? 42 : 40) * k, H = (A ? 68 : 54) * k, ox = W / 2, oy = H - 2 * k;
    var p = new PX.Pic(Math.round(W), Math.round(H));
    function X(u) { return ox + u * k; }
    function Y(u) { return oy + u * k; }
    var skin = SKIN[d.skin], hair = HAIR[d.hair], top = CLOTH[d.topR];

    var bob = pose.bob || 0, lean = pose.lean || 0, chest = pose.chest || 0;
    var hip0 = -(2.6 + legL * 2 - 0.05), hipY = hip0 + bob;

    var shs = [[(A ? -2.8 : -2.2) + lean, shY], [(A ? 5.6 : 4.5) + lean, shY + 0.4]];             // near, far

    function limbJoint(i, isLeg) {
      if (isLeg) { var f = pose.feet[i]; return ik(hips[i][0], hips[i][1], hips[i][0] + f[0] * sL, hip0 + f[1] * sL, legL, legL, -1); }
      var h = pose.hands[i]; return ik(shs[i][0], shs[i][1], shs[i][0] + h[0] * sA, shs[i][1] + h[1] * sA, armL, armL, 1);
    }
    var legsJ = [limbJoint(0, true), limbJoint(1, true)], armsJ = [limbJoint(0, false), limbJoint(1, false)];

    /* -- back things */
    if (d.pack) {
      p.part('pack');
      p.rbox(X(-9.6 + lean), Y(topY + 1.2), X(-2.6 + lean), Y(hipY - 0.6), 2.6 * k, CLOTH.yellow, { vert: 0.6 });
      p.rbox(X(-9.0 + lean), Y(topY + 5.6), X(-4.6 + lean), Y(hipY - 1.4), 1.4 * k, CLOTH.yellow, { tone: 2 });

    arm(p, d, X, Y, shs[1], armsJ[1], armL, k, 'armB', top);
    leg(p, d, X, Y, hips[1], legsJ[1], k, 'legB');
    leg(p, d, X, Y, hips[0], legsJ[0], k, 'legF');

    /* -- torso */
    p.part('torso');

    if (d.top === 'dress') {
      p.rbox(X(tw0 + lean), Y(topY), X(tw1 + lean), Y(hipY + 1), 2.6 * k, top, { vert: 0.4 });
      p.poly([[X(tw0 + 0.2 + lean), Y(hipY - 2.5)], [X(tw1 - 0.2 + lean), Y(hipY - 2.5)], [X(tw1 + 2.6 + lean * 0.5), Y(hipY + 4.6)], [X(tw0 - 2.4 + lean * 0.5), Y(hipY + 4.6)]], top, { cx: X(1 + lean), cy: Y(hipY - 3) });
      for (var pl = -2; pl <= 3; pl += 2.5) p.decal(['k', 'k'], Math.round(X(pl + 0.5 + lean * 0.6)), Math.round(Y(hipY + 2.6)), { k: top.c[2] });
    } else {
      p.rbox(X(tw0 + lean), Y(topY), X(tw1 + lean), Y(hipY + 1.4), (A ? 3 : 2.6) * k, top, { vert: 0.4 });
    }

      var sk = CLOTH[d.skirtR];
      p.part('skirt');
      p.poly([[X(-5.4 + lean * 0.4), Y(hipY - 1.2)], [X(5.9 + lean * 0.4), Y(hipY - 1.2)], [X(7.8 + lean * 0.3), Y(hipY + 4.2)], [X(-7.2 + lean * 0.3), Y(hipY + 4.2)]], sk, { cx: X(1), cy: Y(hipY - 2) });
      [-3.4, -0.6, 2.2, 5].forEach(function (u) { p.decal(['k', 'k', 'k'], Math.round(X(u + lean * 0.3)), Math.round(Y(hipY + 1.4)), { k: sk.c[2] }); });

    p.part('neck');
    p.rbox(X(hx - 2.7), Y(topY - 3.4), X(hx + 1.3), Y(topY + 1.4), 1.2 * k, SKIN[d.skin], { tone: 2 });
    outfit(p, d, X, Y, topY, hipY, lean, k, top, A, tw0, tw1);
    if (d.pack) {   // both straps over the shoulders; the near arm will cover part of one
      p.part('strap', { soft: true });
      p.capsule(X(-0.8 + lean), Y(topY + 0.2), X(-0.3 + lean), Y(hipY - 3.4), 0.75 * k, CLOTH.yellow, { tone: 1 });
      p.capsule(X(4.0 + lean), Y(topY + 0.6), X(4.4 + lean), Y(hipY - 3.6), 0.75 * k, CLOTH.yellow, { tone: 2 });
    }

    head(p, d, X, Y, hx, hy, k, expr || 'neutral', pose, opts);

    /* -- a carried thing sits in front of the chest, between the hands */
    if (opts.hold) {
      var itc = item(opts.hold.name || opts.hold, !!opts.hold.many, k, 1.05);
      var mx = (armsJ[0].ex + armsJ[1].ex) / 2 + 0.6, my = Math.max(armsJ[0].ey, armsJ[1].ey) + 5.0;

    /* -- the near arm, in front of everything */
    arm(p, d, X, Y, shs[0], armsJ[0], armL, k, 'armF', top);
    var cv = p.toCanvas();
    // where things attach, in canvas pixels (outline adds 1)
    cv.anchor = { x: Math.round(ox) + 1, y: Math.round(oy) + 1 };
    cv.hand = { x: Math.round(X((armsJ[0].ex + armsJ[1].ex) / 2)) + 1, y: Math.round(Y((armsJ[0].ey + armsJ[1].ey) / 2)) + 1 };

  }

  function arm(p, d, X, Y, sh, j, armL, k, name, top) {
    var skin = SKIN[d.skin];

    }
  }

  function leg(p, d, X, Y, hip, j, k, name) {

  function outfit(p, d, X, Y, topY, hipY, lean, k, top, A, tw0, tw1) {

      p.part('collar', { soft: true });
      p.poly([[X(-0.4 + lean), Y(topY - 1.0)], [X(2.3 + lean), Y(topY + 1.2)], [X(0.4 + lean), Y(topY + 3.0)], [X(-1.4 + lean), Y(topY + 0.4)]], top, { tone: 0 });
      p.poly([[X(5.2 + lean), Y(topY - 1.0)], [X(2.7 + lean), Y(topY + 1.2)], [X(4.6 + lean), Y(topY + 3.0)], [X(6.2 + lean), Y(topY + 0.4)]], top, { tone: 1 });
      p.part('tie');
      p.poly([[X(1.4 + lean), Y(topY + 0.3)], [X(3.6 + lean), Y(topY + 0.3)], [X(3.2 + lean), Y(topY + 2.4)], [X(1.8 + lean), Y(topY + 2.4)]], tie, { tone: 2 });
      p.poly([[X(1.7 + lean), Y(topY + 2.4)], [X(3.3 + lean), Y(topY + 2.4)], [X(3.9 + lean), Y(hipY - 3.4)], [X(2.5 + lean), Y(hipY - 1.6)], [X(1.1 + lean), Y(hipY - 3.4)]], tie, { cx: X(2.5 + lean), cy: Y(topY + 5), min: 2 });
      p.retone(function (px2, py2) { return Math.abs(px2 - X(2.1 + lean)) < 0.5 * k && py2 > Y(topY + 3) && py2 < Y(hipY - 4); }, -1, ['tie']);

        p.decal(k === 1 ? ['ss'] : ['ssss', 's..s', 'ssss'], Math.round(X(1.6 + lean)), Math.round(Y(hipY - 0.8)), { s: '#c8cbe8' });
      }

      p.part('shirt', { soft: true });

  }

  /* -------------------------------- hair: back masses, tails */
  function hairBack(p, d, X, Y, hx, hy, k, pose, which) {
    var hr = HAIR[d.hair], sway = pose.run ? 1.6 : 0;
    if (d.style === 'ponytail') {
      p.part('tail');
      p.capsule(X(hx - 6.6), Y(hy - 6.4), X(hx - 10.6 - sway), Y(hy + 1.6), 2.5 * k, hr);
      p.ellipse(X(hx - 11.2 - sway * 1.2), Y(hy + 3.6), 2.2 * k, 3.4 * k, hr);
      p.ellipse(X(hx - 11.6 - sway * 1.4), Y(hy + 6.2), 1.3 * k, 1.9 * k, hr);
    } else if (d.style === 'pigtails') {
      p.part('tail');
      p.capsule(X(hx - 7.6), Y(hy + 0.8), X(hx - 10.0 - sway), Y(hy + 7.2), 2.3 * k, hr);
      p.ellipse(X(hx - 10.2 - sway), Y(hy + 8.4), 1.8 * k, 2.0 * k, hr);
      p.part('tailR');
      p.capsule(X(hx + 6.2), Y(hy + 1.8), X(hx + 8.2 + sway * 0.3), Y(hy + 8.6), 2.2 * k, hr);
      p.ellipse(X(hx + 8.4 + sway * 0.3), Y(hy + 9.6), 1.7 * k, 1.9 * k, hr);
    }
  }

  function hairline(pts) {   // piecewise-linear y(x)
    return function (x) {
      if (x <= pts[0][0]) return pts[0][1];
      for (var i = 1; i < pts.length; i++) if (x <= pts[i][0]) {
        var a = pts[i - 1], b = pts[i], t = (x - a[0]) / (b[0] - a[0]);

    };
  }

  var STRANDS = {   // darker lines that give hair its flow (units from the head centre)

    bowl: [[[0.6, -9.6], [0.6, -5.6], [0.6, -2.4]], [[3.6, -9.4], [3.4, -5.4], [3.4, -2.6]], [[6.4, -8.4], [6.6, -5.0], [6.6, -2.4]], [[-3.4, -8.8], [-4.6, -5.0], [-5.2, -1.0]]],
    bob: [[[0.6, -9.2], [0.4, -5.4], [0.6, -2.0]], [[3.8, -9.0], [3.8, -5.6], [3.8, -2.4]], [[6.6, -7.8], [7.4, -3.6], [8.0, 1.6]], [[-3.6, -8.4], [-5.4, -3.6], [-6.0, 3.2]]],
    pigtails: [[[0.4, -9.4], [1.6, -5.6], [1.8, -2.4]], [[4.2, -8.8], [5.4, -5.2], [5.6, -2.4]], [[-3.6, -8.6], [-5.6, -4.6], [-6.4, -0.6]]],
    spiky: [[[-2.6, -9.6], [-3.4, -6.4], [-5.0, -3.6]], [[2.2, -9.0], [3.0, -6.2], [2.8, -3.6]]],
    messy: [[[-3.2, -9.4], [-4.4, -6.0], [-6.0, -2.6]], [[1.0, -9.8], [1.6, -6.6], [1.2, -3.8]], [[4.6, -8.4], [5.6, -5.6], [5.8, -3.2]]]
  };
  function stroke(p, pts, delta, names, k) {

  /** one thing, or a little group of three (these / those) */

<script>/* js/gfx/ui.js */
/* Pocket Quest - pixel UI kit (rework).
 * Panels, the dialog box with a portrait, the mission banner, answer blocks,

 * Everything is drawn in world pixels (480x270) with the pixel font, so the
 * interface and the world share one pixel size.
 */
window.PQ = window.PQ || {};
PQ.ui = (function () {
  'use strict';
  var F = PQ.font, INK = '#1b1029';
  var COL = {
    ink: INK, panel: '#231c42', panel2: '#2d2556', panelLo: '#1a1533', gold: '#ffd64a', goldHi: '#fff1a6', goldLo: '#d98c2f',
    goldDeep: '#8e4f22', white: '#ffffff', cream: '#fff6e0', text: '#ffffff', dim: '#b9b2d9', pink: '#ff9ab8', green: '#7ee07a',
    red: '#f0564f', blank: '#f7bc45', blankOk: '#66cb5b'

  function rect(g, c, x, y, w, h) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  /** the house panel: ink edge, bevelled gold frame, deep purple fill */
  function panel(g, x, y, w, h, o) {
    o = o || {};
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    rect(g, 'rgba(10,6,20,0.35)', x + 2, y + 3, w, h);                 // drop shadow
    rect(g, INK, x + 1, y, w - 2, h); rect(g, INK, x, y + 1, w, h - 2);
    rect(g, COL.goldLo, x + 1, y + 1, w - 2, h - 2);
    rect(g, COL.gold, x + 1, y + 1, w - 3, h - 3);
    rect(g, COL.goldHi, x + 2, y + 1, w - 4, 1); rect(g, COL.goldHi, x + 1, y + 2, 1, h - 4);
    rect(g, COL.goldDeep, x + 3, y + 3, w - 6, h - 6);
    var fill = o.fill || COL.panel;
    rect(g, fill, x + 4, y + 4, w - 8, h - 8);
    rect(g, o.fill2 || COL.panel2, x + 4, y + 4, w - 8, Math.max(2, Math.round((h - 8) * 0.38)));
    rect(g, 'rgba(255,255,255,0.08)', x + 4, y + 4, w - 8, 1);
    // rivets
    [[x + 2, y + 2], [x + w - 4, y + 2], [x + 2, y + h - 4], [x + w - 4, y + h - 4]].forEach(function (p) {
      rect(g, COL.goldDeep, p[0], p[1], 2, 2); rect(g, COL.goldHi, p[0], p[1], 1, 1);
    });
  }
  /** a light card: cream paper with an ink edge (bubbles, prompts, choices) */
  function card(g, x, y, w, h, o) {
    o = o || {};
    x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
    if (o.shadow !== false) rect(g, 'rgba(10,6,20,0.3)', x + 1, y + 2, w, h);
    rect(g, INK, x + 1, y, w - 2, h); rect(g, INK, x, y + 1, w, h - 2);
    rect(g, o.fill || COL.white, x + 1, y + 1, w - 2, h - 2);
    rect(g, o.lo || '#dcd6f0', x + 1, y + h - 3, w - 2, 2);
    if (o.hi !== false) rect(g, '#ffffff', x + 2, y + 1, w - 4, 1);
  }
  function tail(g, x, y, dir, fill) {   // a speech tail pointing down at (x, y)
    var rows = [[-3, 6], [-2, 4], [-1, 2]];
    rows.forEach(function (r, i) { rect(g, INK, x + r[0] - 1, y - 3 + i, r[1] + 2, 1); rect(g, fill || '#ffffff', x + r[0], y - 3 + i, r[1], 1); });
    rect(g, INK, x - 1, y, 2, 1);
  }

  /* ---- icons, drawn from little grids */
  function icon(g, rows, x, y, pal) {
    for (var j = 0; j < rows.length; j++) for (var i = 0; i < rows[j].length; i++) {

  var STAR = ['....k....', '...kyk...', '...kyk...', 'kkkyyykkk', 'kyyyyyyyk', '.kyyyoyk.', '..kyyyk..', '.kyyoyyk.', '.kyk.kyk.', 'kkk...kkk'];
  var HAND = ['...kk.kk...', '..kwwkwwk..', '..kwwkwwkk.', 'kkkwwkwwkwk', 'kwkwwwwwkwk', 'kwwwwwwwwwk', '.kwwwwwwwwk', '.kwwwwwwwk.', '..kwwwwwwk.', '...kwwwwk..', '...kkkkkk..'];
  var SPEAKER = ['....k...', '...kk.k.', 'kkkwk..k', 'kwwwk.k.', 'kwwwk..k', 'kkkwk.k.', '...kk...', '....k...'];
  var NOTE = ['...kkk', '...kwk', '...kk.', '...k..', '.kkk..', 'kwwk..', 'kwwk..', '.kk...'];
  function star(g, x, y) { icon(g, STAR, x, y, { k: INK, y: COL.gold, o: COL.goldLo }); }
  function hand(g, x, y, col) { icon(g, HAND, x, y, { k: INK, w: col || '#fdcaa8' }); }

  function label(f) { return f.word + ' ' + f.verb; }
  function demoSentence(f, n) { return label(f) + ' ' + (f.many ? n.many : n.one) + '.'; }
  function demoTail(f, n) { return f.many ? n.many + '.' : n.one + '.'; }
  function bringMe(f, n) { return 'Bring me ' + f.key + ' ' + (f.many ? n.many : n.sing) + '!'; }
  function demoHint(f, chosen, n) {
    var parts = [];
    if (chosen.near !== f.near) parts.push(f.near ? 'It is near.' : 'It is far.');
    if (chosen.many !== f.many) parts.push(f.many ? 'Look! Three ' + n.many + '.' : 'Look! One ' + n.sing + '.');
    return parts.join(' ') || 'Look again!';
  }

  /* ------------------------------------------------ possessive adjectives
   * People: who they are, how the game refers to them, and the subject pronoun
   * that unlocks the possessive (I-my, you-your, he-his, she-her, we-our, they-their).
   */
  var PEOPLE = {
    mia:   { id: 'mia', name: 'Mia', he: 'She', poss: 'her' },
    max:   { id: 'max', name: 'Max', he: 'He', poss: 'his' },
    twins: { id: 'twins', name: 'Bo and Bea', he: 'They', poss: 'their', group: true }
  };
  var CONFUSE = {
    my: ['your', 'his', 'her'], your: ['my', 'his', 'her'], his: ['her', 'their', 'my'],
    her: ['his', 'their', 'your'], our: ['their', 'my', 'your'], their: ['our', 'his', 'her']
  };

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function cap1(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /** A possessive scene for the answer-block challenge.
   *  Returns { speaker, owner, item, many, before, after, answer, options, hint, sentence } */
  function ownScene(answer, pool) {
    var s = {};
    switch (answer) {
      case 'my':
        s.speaker = pick(['mia', 'max']); s.owner = s.speaker; s.item = pick(['ball', 'bag', 'book']);
        s.hint = 'I am ' + PEOPLE[s.speaker].name + '!';
        break;
      case 'your':
        s.speaker = pick(['mia', 'max']); s.owner = s.speaker === 'mia' ? 'max' : 'mia';
        s.item = pick(['pencil', 'lunchbox', 'cap']); s.ask = true;
        s.hint = 'You are ' + PEOPLE[s.owner].name + '!';
        break;
      case 'his':
        s.speaker = pick(['mia', 'twins']); s.owner = 'max'; s.item = pick(['cap', 'ball', 'lunchbox']);
        s.hint = 'He is Max.';
        break;
      case 'her':
        s.speaker = pick(['max', 'twins']); s.owner = 'mia'; s.item = pick(['bag', 'book', 'pencil']);
        s.hint = 'She is Mia.';
        break;
      case 'our':
        s.speaker = 'twins'; s.owner = 'twins'; s.item = pick(['box', 'ball']);
        s.hint = 'We are Bo and Bea!';
        break;
      case 'their':
        s.speaker = pick(['mia', 'max']); s.owner = 'twins'; s.item = 'crayon'; s.many = true;
        s.hint = 'They are Bo and Bea.';
        break;
    }
    if (pool) s.item = pick(pool);   // a zone's own things (lunch boxes, apples...)
    var n = NOUNS[s.item];
    var noun = s.many ? n.many : n.sing;
    if (s.ask) {
      s.before = 'Is this'; s.after = noun + ', ' + PEOPLE[s.owner].name + '?';
    } else {
      s.before = s.many ? 'These are' : 'This is'; s.after = noun + '.';
    }
    s.answer = answer;
    s.sentence = s.before + ' ' + answer + ' ' + s.after;
    s.options = shuffle([answer].concat(shuffle(CONFUSE[answer]).slice(0, 2)));
    return s;
  }

  /** "This is her lunch box." -> bring it to the right person. */
  function deliverScene(owner, pool) {
    var many = owner === 'twins';
    var item = pool ? pick(pool) : many ? pick(['crayon', 'pencil', 'book']) : pick(['lunchbox', 'bag', 'book', 'ball']);
    var n = NOUNS[item], poss = PEOPLE[owner].poss;
    var sentence = (many ? 'These are ' : 'This is ') + poss + ' ' + (many ? n.many : n.sing) + '.';
    return {
      owner: owner, item: item, many: many, sentence: sentence,
      prompt: sentence + (many ? ' Give them back!' : ' Give it back!'),
      thanks: function (who) {
        var mine = who === 'twins' ? 'our' : 'my';
        return many ? 'Yes! They are ' + mine + ' ' + n.many + '. Thank you!'
                    : 'Yes! It is ' + mine + ' ' + n.sing + '. Thank you!';
      },
      notMine: function (who) {
        var mine = who === 'twins' ? 'our' : 'my';
        return many ? 'No, they aren\'t ' + mine + ' ' + n.many + '.'
                    : 'No, it isn\'t ' + mine + ' ' + n.sing + '.';
      }
    };
  }

  /** Batuhan Teacher: "Is this his cap?" -> Yes, it is. / No, it isn't. ... */
  var YN = ['Yes, it is.', 'No, it isn\'t.', 'Yes, they are.', 'No, they aren\'t.'];
  function yesNoScene(truth, pool) {
    var owner = pick(['mia', 'max', 'twins']);
    var many = owner === 'twins' ? Math.random() < 0.75 : Math.random() < 0.3;
    var item = pool ? pick(pool) : many ? pick(['crayon', 'pencil', 'book']) : pick(['cap', 'bag', 'lunchbox', 'ball', 'book']);
    var real = PEOPLE[owner].poss;
    var asked = truth ? real : pick(['his', 'her', 'their'].filter(function (p) { return p !== real; }));
    var n = NOUNS[item];
    var q = (many ? 'Are these ' : 'Is this ') + asked + ' ' + (many ? n.many : n.sing) + '?';
    var answer = many ? (truth ? YN[2] : YN[3]) : (truth ? YN[0] : YN[1]);
    var follow = truth ? '' : ' ' + (many ? 'They are ' : 'It is ') + real + ' ' + (many ? n.many : n.sing) + '.';
    return {
      owner: owner, item: item, many: many, question: q, answer: answer, options: YN.slice(),
      full: answer + follow, ownerHint: PEOPLE[owner].he + (owner === 'twins' ? ' are ' : ' is ') + PEOPLE[owner].name + '.',
      countHint: many ? 'Look! Three ' + n.many + '.' : 'Look! One ' + n.sing + '.'
    };
  }

  /* ------------------------------------------------ reading (worksheet exercise 8)
   * A short text in the unit's language, then sentences to answer Yes / No
   * and questions with three answers. Our own texts and our own people. */
  var READINGS = {
    max: {
      who: 'max', title: 'Max at School',
      pages: [
        ['Hi! I am Max. I am eight. I am from Turkey. Bluebird School is my school.',
         'This is my cap. It is red. That is my ball. I love P.E.! We play in the gym.'],
        ['My teacher is Batuhan Teacher. He is funny. Bo and Bea are my friends. They are twins.',
         'Math is easy for me, but reading is hard. We eat lunch in the cafeteria.']
      ],
      qs: [
        { q: 'Max is eight years old.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'Max\'s cap is blue.', options: ['Yes', 'No'], answer: 'No', why: 'It is red.' },
        { q: 'Bo and Bea are twins.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'Reading is easy for Max.', options: ['Yes', 'No'], answer: 'No', why: 'Reading is hard for him.' },
        { q: 'Where do they play?', options: ['in the gym', 'in the library', 'in the cafeteria'], answer: 'in the gym' },
        { q: 'Who is Max\'s teacher?', options: ['Bo', 'Batuhan Teacher', 'Mia'], answer: 'Batuhan Teacher' }
      ]
    },
    mia: {
      who: 'mia', title: 'Mia in the Library',
      pages: [
        ['Hello! My name is Mia. I am seven. I love books.',
         'This is our library. It is big and quiet. Those books are on the high shelves. These books are on the table.'],
        ['This is my library card. It is pink. My favorite book is about a cat.',
         'We read stories here. We are quiet in the library. Shh!']
      ],
      qs: [
        { q: 'Mia is seven years old.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'The library is small.', options: ['Yes', 'No'], answer: 'No', why: 'It is big.' },
        { q: 'Mia\'s library card is pink.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'Her favorite book is about a dog.', options: ['Yes', 'No'], answer: 'No', why: 'It is about a cat.' },
        { q: 'Where are those books?', options: ['on the table', 'on the high shelves', 'in my bag'], answer: 'on the high shelves' }
      ]
    },
    // {hero} is the player's hero (Rio or Luna)
    pip: {
      who: 'pip', name: 'Pip', title: 'Pip the Bird',
      pages: [
        ['Tweet! I am Pip. I am a bird. I am small and blue.',
         'I am from the Big Tree. {hero} is my best friend.'],
        ['I love music. This is my song: Tweet, tweet!',
         'I do not like pockets. They are dark and scary!']
      ],
      qs: [
        { q: 'Pip is a bird.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'Pip is big.', options: ['Yes', 'No'], answer: 'No', why: 'He is small.' },
        { q: 'Pip loves music.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'Pip likes pockets.', options: ['Yes', 'No'], answer: 'No', why: 'They are scary for him.' },
        { q: 'Where is Pip from?', options: ['the Big Tree', 'the Pocket', 'the gym'], answer: 'the Big Tree' },
        { q: 'What color is Pip?', options: ['blue', 'red', 'purple'], answer: 'blue' }
      ]
    },
    twins: {
      who: 'twins', title: 'Bo and Bea at Lunch',
      pages: [
        ['Hi! We are Bo and Bea. We are twins. We are seven. We are from Turkey.',
         'This is our cafeteria. It is big. These are our lunch boxes. They are yellow.'],
        ['This is Bo\'s apple. It is red. That is Bea\'s sandwich.',
         'Our favorite subject is Art. Mia is our friend. Her bag is pink.']
      ],
      qs: [
        { q: 'Bo and Bea are twins.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'They are eight years old.', options: ['Yes', 'No'], answer: 'No', why: 'They are seven.' },
        { q: 'Their lunch boxes are yellow.', options: ['Yes', 'No'], answer: 'Yes' },
        { q: 'Bo\'s apple is green.', options: ['Yes', 'No'], answer: 'No', why: 'It is red.' },
        { q: 'What is their favorite subject?', options: ['Art', 'Music', 'Math'], answer: 'Art' },
        { q: 'Who is their friend?', options: ['Max', 'Mia', 'Grabbo'], answer: 'Mia' }
      ]
    }
  };

  /* ------------------------------------------------ making questions
   * The hero asks, a classmate answers. The blank is the question word:
   * "___ is your name?" -> What. The answer shows what kind of word it is. */
  var KIDS = { mia: 'Mia', max: 'Max', bo: 'Bo', bea: 'Bea' };
  var AGES = { mia: 'seven', max: 'eight', bo: 'seven', bea: 'seven' };
  var QWORDS = ['What', 'How old', 'Where', 'Who'];
  function questionScene(kind, pool) {
    var who = pick(['mia', 'max', 'bo', 'bea']), s = { kind: kind, who: who };
    if (kind === 'name') { s.answer = 'What'; s.after = 'is your name?'; s.reply = 'My name is ' + KIDS[who] + '.'; s.hint = 'Look! It is a name.'; }
    if (kind === 'age') { s.answer = 'How old'; s.after = 'are you?'; s.reply = 'I am ' + AGES[who] + '.'; s.hint = 'Look! It is a number.'; }
    if (kind === 'from') { s.answer = 'Where'; s.after = 'are you from?'; s.reply = 'I am from Turkey.'; s.hint = 'Look! It is a place.'; }
    if (kind === 'who') {
      s.other = pick(Object.keys(KIDS).filter(function (k) { return k !== who; }));
      s.answer = 'Who'; s.after = 'is this?'; s.reply = 'This is ' + KIDS[s.other] + '.'; s.hint = 'Look! It is a person.';
    }
    if (kind === 'what') {
      s.item = pool ? pick(pool) : pick(['ruler', 'pencil', 'book', 'eraser', 'ball']);
      s.answer = 'What'; s.after = 'is this?'; s.reply = 'It is ' + NOUNS[s.item].one + '.'; s.hint = 'Look! It is a thing.';
    }
    var others = QWORDS.filter(function (q) { return q !== s.answer; });
    if (kind === 'what') others = ['Who'].concat(shuffle(['How old', 'Where']).slice(0, 1));
    else others = shuffle(others).slice(0, 2);
    s.options = shuffle([s.answer].concat(others));
    s.sentence = s.answer + ' ' + s.after;
    s.name = KIDS[who];
    return s;
  }

  /* ------------------------------------------------ subject, place or person */
  var SORT = {
    subject: ['Math', 'English', 'Music', 'Art', 'P.E.', 'Science'],
    place: ['The gym', 'The library', 'The classroom', 'The cafeteria', 'The playground', 'The music room'],
    person: ['A teacher', 'A student', 'A friend']
  };
  var SORT_HINT = { subject: 'We learn it in class!', place: 'We go there!', person: 'It is someone, like you!' };
  function sortScene(cat) {
    var w = pick(SORT[cat]);
    return { word: w, cat: cat, before: w + ' is a', after: '.', answer: cat, options: shuffle(['subject', 'place', 'person']),
      sentence: w + ' is a ' + cat + '.', hint: SORT_HINT[cat] };
  }

  /* ------------------------------------------------ the rooftop: Grabbo
   * Hush's stolen words fly out of the Pocket as bubbles. Somebody says a
   * sentence with a word missing; the hero catches the right word and throws
   * it back. Each right word frees one thing from the Pocket.
   * show: the thing the sentence is about, where everybody can see how far it
   * is from whoever speaks: 'far' (up in Grabbo's claw, across the roof) or
   * 'near' (Grabbo drops it at the speaker's feet). All four of this / that /
   * these / those are right answers somewhere: two near, two far, two one,
   * two many. form: the legend's cell (shown after a mistake). */
  var BOSS = [
    { who: 'mia', before: '', after: 'is my bag!', answer: 'That', options: ['That', 'This', 'Those'], form: 'that', show: { item: 'bag', at: 'far' }, give: { item: 'bag', to: 'mia' }, hint: 'Look! The bag is far. One bag.' },
    { who: 'twins', before: 'Those are', after: 'crayons!', answer: 'our', options: ['our', 'their', 'your'], show: { item: 'crayon', many: true, at: 'far' }, give: { item: 'crayon', many: true, to: 'twins' }, hint: 'We are Bo and Bea!' },
    { who: 'max', before: '', after: 'is my ball!', answer: 'This', options: ['This', 'That', 'These'], form: 'this', show: { item: 'ball', at: 'near' }, give: { item: 'ball', to: 'max' }, hint: 'Look! The ball is near Max. One ball.' },
    { who: 'batuhan', before: 'That is', after: 'lunch box!', answer: 'his', options: ['his', 'her', 'their'], point: 'max', show: { item: 'lunchbox', at: 'far' }, give: { item: 'lunchbox', to: 'max' }, hint: 'He is Max.' },
    { who: 'twins', before: '', after: 'are our pencils!', answer: 'These', options: ['These', 'Those', 'This'], form: 'these', show: { item: 'pencil', many: true, at: 'near' }, give: { item: 'pencil', many: true, to: 'twins' }, hint: 'Look! The pencils are near. Three pencils.' },
    { who: 'bo', before: '', after: 'are her books!', answer: 'Those', options: ['Those', 'That', 'These'], form: 'those', point: 'mia', show: { item: 'book', many: true, at: 'far' }, give: { item: 'book', many: true, to: 'mia' }, hint: 'Look! The books are far. Three books.' },
    { who: 'hero', before: '', after: 'is your name?', answer: 'What', options: ['What', 'Where', 'How old'], reply: 'My name is... Grabbo.', hint: 'It is a name.' },
    { who: 'hero', before: '', after: 'are you from?', answer: 'Where', options: ['Where', 'Who', 'What'], reply: 'I am from... the Pocket.', hint: 'It is a place.' },
    { who: 'batuhan', before: 'This is', after: 'school, Grabbo!', answer: 'our', options: ['our', 'my', 'his'], hint: 'We are all here. It is ours!' }
  ];
  BOSS.forEach(function (r) { r.full = (r.before ? r.before + ' ' : '') + r.answer + ' ' + r.after; });

  return {
    READINGS: READINGS, questionScene: questionScene, sortScene: sortScene, BOSS: BOSS, KIDS: KIDS,
    NOUNS: NOUNS, DEMO_NOUNS: DEMO_NOUNS, FORMS: FORMS, PEOPLE: PEOPLE, YN: YN,
    formFor: formFor, label: label, demoSentence: demoSentence, demoTail: demoTail,
    bringMe: bringMe, demoHint: demoHint, ownScene: ownScene, deliverScene: deliverScene,
    yesNoScene: yesNoScene, pick: pick, shuffle: shuffle, cap1: cap1
  };
})();

</script>
<script>/* js/level.js */
/* Pocket Quest - level layout.
 * The map is 17 rows of 16px tiles (the screen is 480x270); the ground top
 * is row 14, at y 224. Zones are written as if the ground were row G = 11
 * (the old, shorter screen) and every row is shifted down by SHIFT on the way
 * in, so heights above the ground read the same as before. A station is a flat
 * stretch of 30 columns, wider than a screen: the camera keeps its start in
 * view and then follows the hero. A goo gate at its last column stays shut
 * until the challenge is solved. People and things stand on the ground; the
 * player walks up to them and presses the interact key, so walking past
 * never counts as an answer.
 */
window.PQ = window.PQ || {};
PQ.levels = (function () {
  'use strict';
  var ROWS = 17, GROUND_ROW = 14, SHIFT = 3, G = GROUND_ROW - SHIFT, STATION_W = 30;
  var T = { EMPTY: 0, GROUND: 1, BRICK: 2, PLANK: 3 };

  function Builder(w) {
    this.w = w; this.h = ROWS;
    this.tiles = new Uint8Array(w * ROWS);
    this.stars = []; this.goos = []; this.stations = []; this.decor = [];
    this.movers = []; this.springs = []; this.crumbles = []; this.belts = []; this.puddles = []; this.bonuses = [];
    this.x = 0;
  }
  Builder.prototype.set = function (x, y, t) {
    y += SHIFT;
    if (x < 0 || x >= this.w || y < 0 || y >= ROWS) return;
    this.tiles[y * this.w + x] = t;
  };
  Builder.prototype.ground = function (x0, x1, top) {
    top = top === undefined ? G : top;
    for (var x = x0; x < x1; x++) for (var y = top; y < ROWS - SHIFT; y++) this.set(x, y, T.GROUND);
  };
  Builder.prototype.bricks = function (x, y, w, h) {
    for (var i = 0; i < w; i++) for (var j = 0; j < (h || 1); j++) this.set(x + i, y + j, T.BRICK);
  };
  Builder.prototype.plank = function (x, y, w) { for (var i = 0; i < w; i++) this.set(x + i, y, T.PLANK); };
  Builder.prototype.star = function (x, y) { this.stars.push({ x: x * 16 + 8, y: (y + SHIFT) * 16 + 8 }); };
  Builder.prototype.starRow = function (x, y, n) { for (var i = 0; i < n; i++) this.star(x + i, y); };
  Builder.prototype.starArc = function (x, y, n) {
    for (var i = 0; i < n; i++) {
      var t = n === 1 ? 0.5 : i / (n - 1);
      this.stars.push({ x: (x + i) * 16 + 8, y: (y + SHIFT - Math.sin(t * Math.PI) * 2) * 16 + 8 });
    }
  };
  /** one of Hush's ink blobs: kind 'walk' (to and fro), 'hop' (it jumps now and then)
   *  or 'fly' (it flies to and fro on row y, in a wave) */
  Builder.prototype.goo = function (x, range, kind, y) { this.goos.push({ x: x * 16, range: (range || 3) * 16, kind: kind || 'walk', y: y === undefined ? null : (y + SHIFT) * 16 }); };
  /* ---- the things that move (game.js gives them their physics). You land
   * on all of them from above and jump up through them from below. */
  /** a plank w tiles wide, its top on row y, going to and fro by (dx, dy) tiles, once there and back every period seconds */
  Builder.prototype.mover = function (x, y, w, dx, dy, period, phase) {
    this.movers.push({ x: x * 16, y: (y + SHIFT) * 16, w: w * 16, dx: dx * 16, dy: dy * 16, period: period || 4, phase: phase || 0 });
  };
  /** a trampoline on the floor at column x: it throws you twice as high as a jump */
  Builder.prototype.spring = function (x) { this.springs.push({ x: x * 16 + 8, y: (G + SHIFT) * 16 }); };
  /** a stack of books w tiles wide, its top on row y: soon after you land it gives way, then comes back */
  Builder.prototype.crumble = function (x, y, w) { this.crumbles.push({ x: x * 16, y: (y + SHIFT) * 16, w: (w || 2) * 16 }); };
  /** a tray belt w tiles long, its top on row y, running dir (1 right, -1 left): it carries you */
  Builder.prototype.belt = function (x, y, w, dir) { this.belts.push({ x: x * 16, y: (y + SHIFT) * 16, w: w * 16, dir: dir || 1 }); };
  /** Hush's ink on the floor from column x, w tiles: touch it and you go back, as if you fell */
  Builder.prototype.puddle = function (x, w) { this.puddles.push({ x: x * 16, w: w * 16 }); };
  /** the big star of a run: it comes out when every star of the run is taken */
  Builder.prototype.bonus = function (x, y) { this.bonuses.push({ x: x * 16 + 8, y: (y + SHIFT) * 16 + 8 }); };
  Builder.prototype.deco = function (kind, x, y, extra) {
    var d = { kind: kind, x: x * 16, y: (y + SHIFT) * 16 };
    for (var k in extra) d[k] = extra[k];
    this.decor.push(d);
  };
  /** A station occupies [s, s+STATION_W). */
  Builder.prototype.station = function (type, opts) {
    var s = this.x;
    this.ground(s, s + STATION_W);
    if (opts && opts.high) {     // a bookcase three tiles tall at the far end, and a ladder step
      this.bricks(s + 23, G - 3, 6, 3);
      this.plank(s + 20, G - 2, 2);
    }
    var st = { type: type, s: s, gateX: (s + STATION_W - 1) * 16, zone: this.zones ? this.zones.length - 1 : 0 };
    for (var k in opts) st[k] = opts[k];
    this.stations.push(st);
    this.x += STATION_W;
    return st;
  };

  /* ------------------------------------------------------------ zones
   * One unit is one long level made of zones. Each zone has a theme (how its
   * ground and background are drawn), a start, a door at its end, and the
   * stations inside it. Reaching the door with every gate open ends the zone:
   * report card, save, fade, and the next zone's intro.
   */
  Builder.prototype.beginZone = function (z) {
    z.x0 = this.x * 16; z.firstStation = this.stations.length;
    this.zones.push(z); this.zone = z;
  };
  Builder.prototype.endZone = function (doorTile) {
    var z = this.zone;
    z.doorX = doorTile * 16 + 16; z.x1 = this.x * 16; z.lastStation = this.stations.length - 1;
  };

  /* ---------------- zone 1: the school yard ---------------- */
  function zoneYard(b) {
    var x;
    b.beginZone({ id: 'yard', name: 'The School Yard', theme: 'yard' });
    b.ground(0, 16);
    b.deco('school', 1, G);
    b.deco('tree', 13, G);
    b.deco('signRight', 10, G);
    b.starRow(11, 9, 3);
    b.zone.startX = 6 * 16;
    b.x = 16;

    x = b.x;                                   // tutorial hops
    b.ground(x, x + 12);
    b.bricks(x + 3, G - 1, 2, 1);
    b.bricks(x + 7, G - 2, 2, 2);
    b.starArc(x + 2, 8, 4);
    b.star(x + 7, 7); b.star(x + 8, 7);
    b.deco('bush', x + 10, G);
    b.x += 12;

    b.station('say', { form: 'this', legend: true, beat: 'inkWall' });

    x = b.x;                                   // pit, planks, first goo
    b.ground(x, x + 6); b.ground(x + 8, x + 18);
    b.starArc(x + 5, 8, 4);
    b.plank(x + 10, 8, 3);
    b.starRow(x + 10, 7, 3);
    b.goo(x + 14, 3);

    ['say', 'own', 'fetch', 'yesno'],          // room 2: + Is this his ...? Yes, it is.
    ['fetch', 'question', 'say', 'deliver'],   // room 3: + What / Where / How old / Who

    if (!hold) return null;
    if (hold.many) return { item: hold.item, many: false };
    return i === 1 ? hold : null;
  }
  /* a row of answer blocks spread across [xa, xb] of the station */
  var BLOCK_Y = GY - 86, BLOCK_H = 18;
  var HIGH_BLOCK_Y = GY - 112;   // over a bookcase: the hero can stand up there and still climb past
  function blockRow(st, labels, xa, xb) {
    var bold = true, ws = labels.map(function (l) { return Math.max(44, F.measure(l, true) + 16); });
    var span = xb - xa, total = ws.reduce(function (a, b) { return a + b; }, 0);
    if (total + 8 * (labels.length - 1) > span) { bold = false; ws = labels.map(function (l) { return Math.max(44, F.measure(l, false) + 14); }); total = ws.reduce(function (a, b) { return a + b; }, 0); }
    var gap = labels.length > 1 ? Math.min(28, (span - total) / (labels.length - 1)) : 0;
    var x = st.x0 + xa + Math.max(0, (span - total - gap * (labels.length - 1)) / 2);
    st.blocks = labels.map(function (lab, i) {
      var b = { x: Math.round(x), y: st.high ? HIGH_BLOCK_Y : BLOCK_Y, w: ws[i], h: BLOCK_H, label: lab, value: lab, state: 'idle', bump: 0, t: 0, glow: false, st: st, bold: bold };
      x += ws[i] + gap;
      return b;
    });
  }

  var SHELF_Y = GY - 48;   // the top of a station's tall bookcase
  function setupSay(st, f, n, high) {

    blockRow(st, ['This is', 'That is', 'These are', 'Those are'], 92, 410);
    st.answer = C.label(f);
    st.banner = { who: 'pip', caption: 'Hit the right block!', before: '', after: C.demoTail(f, n) };
    st.speak = { who: 'pip', text: st.firstStation ? 'Look, ' + heroName() + '! Hit the right block!' : 'Hit the right block!' };
    st.full = C.demoSentence(f, n);
    st.items = [{ name: n.id, many: f.many, x: st.target.x, y: st.target.y, fixed: true }];
  }
  function setupFetch(st, f, n, high) {
    st.form = f; st.noun = n;
    // everything sits on the ground: two near Pip, two at the far side.
    // Walking past takes nothing; you stand by one and press the interact key.
    var spots = [
      { form: C.FORMS.this, x: st.x0 + 84 }, { form: C.FORMS.these, x: st.x0 + 140 },
      { form: C.FORMS.that, x: st.x0 + (high ? 396 : 384), y: high ? SHELF_Y : GY }, { form: C.FORMS.those, x: st.x0 + 440, y: high ? SHELF_Y : GY }
    ];
    st.items = spots.map(function (p) {

    });

  function setupDeliver(st, owner, pool) {

    st.npcs = people('mia', st.x0 + 206, -1).concat(people('max', st.x0 + 316, -1), people('twins', st.x0 + 422, -1));
    st.npcs.forEach(function (p) { G.npcs.push(p); });

  /* Read a short text at the lectern, then answer about it: Yes / No

  function setupRead(st, r) {
    st.reading = r; st.qi = 0; st.qMistakes = 0; st.wait = 0; st.book = { x: st.x0 + 78 };
    st.npcs = r.who === 'pip' ? [] : people(r.who, st.x0 + 118, -1);   // Pip's own text: Pip is right here
    st.npcs.forEach(function (p) { G.npcs.push(p); });
    st.banner = { who: 'pip', caption: '', text: '' };
    st.speak = { who: 'pip', text: r.who === 'pip' ? 'Read about me! Tweet!' : 'Read about ' + (r.name || C.PEOPLE[r.who].name) + '!' };
    loadQuestion(st);
  }
  function loadQuestion(st) {
    var q = st.reading.qs[st.qi];
    blockRow(st, q.options, 150, 452);
    st.answer = q.answer; st.qMistakes = 0;
    st.banner.caption = 'Read and answer!   ' + (st.qi + 1) + ' / ' + st.reading.qs.length;
    st.banner.text = q.q; st.banner.hint = null; st.banner.ok = false; st.banner.reply = null;

  }
  function fillHero(s) { return s.split('{hero}').join(heroName()); }
  function readingText(r) { return r.title + '. ' + r.pages.map(function (p) { return fillHero(p.join(' ')); }).join(' '); }
  function openBook(st) {

  /* Spell a school word: the letters are scrambled on blocks; bonk them in
   * order. Worksheet exercise 1, as a platformer. */
  function setupSpell(st, word, pic) {
    st.word = word; st.pos = 0;
    var letters = word.split(''), order;
    do { order = C.shuffle(letters); } while (order.join('') === word && word.length > 1);
    var step = 34, w = 26, total = order.length * step - (step - w);
    var x0 = Math.round((VW - total) / 2) + 16;
    st.blocks = order.map(function (ch, i) {
      return { x: st.x0 + x0 + i * step, y: BLOCK_Y, w: w, h: BLOCK_H, label: ch, value: ch, state: 'idle', bump: 0, t: 0, glow: false, st: st, bold: true };
    });

  /* Make the question: a classmate's answer is shown ("Max: I am eight.");
   * the hero asks, so the blank is the question word: How old are you? */
  function setupQuestion(st, kind, pool) {
    var sc = st.scene = C.questionScene(kind, pool);
    var ans = npc(sc.who, st.x0 + 96, -1, sc.item ? { item: sc.item, many: false } : null);
    st.npcs = [ans]; st.speakerNpc = ans;
    if (sc.other) { var o = npc(sc.other, st.x0 + 134, -1); st.npcs.push(o); }
    st.npcs.forEach(function (p) { G.npcs.push(p); });
    blockRow(st, sc.options, 172, 444);
    st.answer = sc.answer;
    st.banner = { who: sc.who, caption: 'Ask ' + sc.name + '!', before: '', after: sc.after, sub: sc.name + ':  ' + sc.reply };
    st.speak = { who: 'pip', text: 'Ask ' + sc.name + '!' };
